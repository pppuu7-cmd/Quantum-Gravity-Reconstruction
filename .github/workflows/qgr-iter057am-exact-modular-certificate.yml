name: QGR Iter057AM exact modular rank and fresh witness certificate

on:
  push:
    paths:
      - '.github/workflows/qgr-iter057am-exact-modular-certificate.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  BASELINE_ARTIFACT_ID: '10468429521'

jobs:
  certificate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check sympy
      - name: Download immutable complete map and baseline on Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p raw/baseline raw/shards out
          f(){ mkdir -p "$2"; curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/$1/zip" -o "$2.zip"; python -m zipfile -e "$2.zip" "$2"; }
          f 10468429521 raw/baseline/base
          f 10469353962 raw/shards/0
          f 10469034827 raw/shards/1
          f 10469468423 raw/shards/2
          f 10469596885 raw/shards/3
          f 10469328100 raw/shards/4
          f 10470120501 raw/shards/5
          f 10469785715 raw/shards/6
          f 10469218826 raw/shards/7
      - name: Download immutable complete map and baseline on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force raw/baseline,raw/shards,out | Out-Null
          $h=@{Authorization="Bearer $env:GH_TOKEN";"X-GitHub-Api-Version"="2022-11-28"}
          function F([string]$id,[string]$dest) { New-Item -ItemType Directory -Force $dest | Out-Null; Invoke-WebRequest -Headers $h -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$id/zip" -OutFile "$dest.zip"; Expand-Archive -Path "$dest.zip" -DestinationPath $dest -Force }
          F 10468429521 raw/baseline/base
          F 10469353962 raw/shards/0
          F 10469034827 raw/shards/1
          F 10469468423 raw/shards/2
          F 10469596885 raw/shards/3
          F 10469328100 raw/shards/4
          F 10470120501 raw/shards/5
          F 10469785715 raw/shards/6
          F 10469218826 raw/shards/7
      - name: Exact modular maximal-minor rank proof and fresh rational witness
        shell: bash
        if: runner.os != 'Windows'
        run: python code/qgr_iter057am_exact_modular_certificate.py --input-root raw --output out/certificate.json
      - name: Exact modular maximal-minor rank proof and fresh rational witness Windows
        shell: pwsh
        if: runner.os == 'Windows'
        run: python code/qgr_iter057am_exact_modular_certificate.py --input-root raw --output out/certificate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter057am-exact-modular-certificate-${{ runner.os }}
          path: out/
          if-no-files-found: error
          retention-days: 30
