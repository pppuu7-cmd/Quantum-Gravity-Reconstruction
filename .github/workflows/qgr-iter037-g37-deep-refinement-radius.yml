name: qgr-iter037-g37-deep-refinement-radius

on:
  push:
    paths:
      - 'status/ITERATION_037_TRIGGER.txt'
  workflow_dispatch:

jobs:
  deep:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        seed_slot: [0,1,2,3,4,5]
        target_index: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: G37 deeper refinement lane
        run: |
          mkdir -p out
          python code/qgr_iter037_g37_deep_refinement_radius.py \
            --stream deep \
            --seed-slot '${{ matrix.seed_slot }}' \
            --target-index '${{ matrix.target_index }}' \
            --out out/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: qgr-g37-deep-${{ matrix.seed_slot }}-${{ matrix.target_index }}
          path: out/result.json

  radius:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        seed_slot: [0,1,2,3,4,5]
        target_index: [0,1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: G37 large-radius path-consistency lane
        run: |
          mkdir -p out
          python code/qgr_iter037_g37_deep_refinement_radius.py \
            --stream radius \
            --seed-slot '${{ matrix.seed_slot }}' \
            --target-index '${{ matrix.target_index }}' \
            --out out/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: qgr-g37-radius-${{ matrix.seed_slot }}-${{ matrix.target_index }}
          path: out/result.json

  aggregate:
    if: always()
    needs: [deep, radius]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: qgr-g37-*
          path: iter037-g37-results
          merge-multiple: false
      - name: Aggregate frozen Iter037 G37 gate
        run: python code/qgr_iter037_g37_aggregate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qgr-g37-summary
          path: iter037-g37-summary/summary.json
