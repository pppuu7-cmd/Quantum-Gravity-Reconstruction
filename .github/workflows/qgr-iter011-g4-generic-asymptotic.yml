name: qgr-iter011-g4-generic-asymptotic
on:
  push:
    branches: [ main ]
    paths:
      - 'code/qgr_iter011_g4_generic_asymptotic_map.py'
      - '.github/workflows/qgr-iter011-g4-generic-asymptotic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lane:
    strategy:
      fail-fast: false
      matrix:
        point: [0, 1, 2, 3]
        kappa: ['0.02', '0.04']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Install numeric dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Run generic asymptotic lane
        env:
          PYTHONPATH: code
        run: |
          mkdir -p build/g4
          python code/qgr_iter011_g4_generic_asymptotic_map.py --point ${{ matrix.point }} --kappa ${{ matrix.kappa }} | tee build/g4/result.json
          python -m json.tool build/g4/result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter011-g4-p${{ matrix.point }}-k${{ matrix.kappa }}
          path: build/g4/result.json
          if-no-files-found: error
  aggregate:
    needs: lane
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Gate matrix completion
        run: |
          echo 'All eight generic-point/amplitude lanes reached terminal job status.'
          echo 'Scientific classification must be read from raw lane artifacts; workflow success is not itself a physics PASS.'
