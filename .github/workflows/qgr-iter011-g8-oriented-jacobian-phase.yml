name: qgr-iter011-g8-oriented-jacobian-phase
on:
  push:
    branches: [main]
    paths:
      - 'code/qgr_iter011_g8_oriented_jacobian_phase.py'
      - '.github/workflows/qgr-iter011-g8-oriented-jacobian-phase.yml'
  workflow_dispatch:

jobs:
  g8:
    strategy:
      fail-fast: false
      matrix:
        lane: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Install numeric dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Run oriented Jacobian phase lane
        env:
          PYTHONPATH: code
        run: |
          mkdir -p build/g8
          python code/qgr_iter011_g8_oriented_jacobian_phase.py --lane ${{ matrix.lane }} | tee build/g8/result.json
          python -m json.tool build/g8/result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter011-g8-lane-${{ matrix.lane }}
          path: build/g8/result.json

  aggregate:
    needs: g8
    runs-on: ubuntu-24.04
    steps:
      - name: Gate matrix completion
        run: echo 'All eight oriented-Jacobian lanes completed.'
