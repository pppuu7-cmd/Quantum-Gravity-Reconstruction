name: qgr-iter011-g5-local-series
on:
  push:
    branches: [ main ]
    paths:
      - 'code/qgr_iter011_g5_local_series_decomposition.py'
      - '.github/workflows/qgr-iter011-g5-local-series.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lane:
    strategy:
      fail-fast: false
      matrix:
        point: [0, 1, 2, 3]
        kappa: ['0.01', '0.02', '0.04']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Install numeric dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Run local-series lane
        env:
          PYTHONPATH: code
        run: |
          mkdir -p build/g5
          python code/qgr_iter011_g5_local_series_decomposition.py --point ${{ matrix.point }} --kappa ${{ matrix.kappa }} | tee build/g5/result.json
          python -m json.tool build/g5/result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter011-g5-p${{ matrix.point }}-k${{ matrix.kappa }}
          path: build/g5/result.json
          if-no-files-found: error
  aggregate:
    needs: lane
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Gate matrix completion
        run: |
          echo 'All twelve generic-point/amplitude lanes reached terminal status.'
          echo 'Read the raw artifacts for physics classification; workflow completion is not a physics PASS.'
