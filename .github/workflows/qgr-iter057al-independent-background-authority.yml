name: QGR Iter057AL independent on-shell R12 background authority

on:
  push:
    paths:
      - '.github/workflows/qgr-iter057al-independent-background-authority.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        candidate: [AL-R1-2, AL-R1-3, AL-R1-4]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact algebra backend
        run: python -m pip install --disable-pip-version-check sympy
      - name: Exact frozen candidate completion through R12
        shell: bash
        run: |
          mkdir -p artifacts
          PYTHONPATH=code python code/qgr_iter057al_independent_background_candidate.py --candidate '${{ matrix.candidate }}' --output 'artifacts/${{ matrix.candidate }}.json'
      - name: Upload immutable candidate authority candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iter057al-${{ matrix.candidate }}
          path: artifacts/${{ matrix.candidate }}.json
          if-no-files-found: error
          retention-days: 30

  validate:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent exact replay backend
        run: python -m pip install --disable-pip-version-check sympy
      - name: Download all frozen candidate artifacts without merging design state
        uses: actions/download-artifact@v4
        with:
          pattern: iter057al-AL-R1-*
          path: candidate-artifacts
      - name: Independent Z-engine replay and held-out assignment
        shell: bash
        run: |
          mkdir -p validator-artifacts
          PYTHONPATH=code:scripts python scripts/qgr_iter057al_independent_background_validator.py --input-root candidate-artifacts --output validator-artifacts/iter057al-validator.json
      - name: Upload terminal authority candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iter057al-independent-background-validator
          path: validator-artifacts/
          if-no-files-found: error
          retention-days: 30
