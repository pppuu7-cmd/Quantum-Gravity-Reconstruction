name: qgr-iter017-g17-common-r-authority

on:
  push:
    paths:
      - 'code/qgr_iter017_g17_common_r_authority.py'
      - 'code/qgr_iter017_g17_aggregate.py'
      - '.github/workflows/qgr-iter017-g17-common-r-authority.yml'
  workflow_dispatch:

jobs:
  lane:
    strategy:
      fail-fast: false
      max-parallel: 24
      matrix:
        audit: [kinematic-measure, flat-family, history-authority, authority-rank]
        lane: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: G17 exact common-r authority audit
        run: |
          mkdir -p out
          python code/qgr_iter017_g17_common_r_authority.py \
            --audit '${{ matrix.audit }}' \
            --lane '${{ matrix.lane }}' \
            --out out/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: qgr-g17-${{ matrix.audit }}-${{ matrix.lane }}
          path: out/result.json

  aggregate:
    needs: lane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: qgr-g17-*
          path: iter017-g17-results
      - name: Aggregate 24 G17 lanes
        run: python code/qgr_iter017_g17_aggregate.py
      - uses: actions/upload-artifact@v4
        with:
          name: qgr-g17-summary
          path: iter017-g17-summary/summary.json
