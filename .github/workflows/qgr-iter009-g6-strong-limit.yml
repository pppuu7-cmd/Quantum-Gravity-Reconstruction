name: qgr-iter009-g6-strong-limit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/qgr_iter009_g6_*.py'
      - '.github/workflows/qgr-iter009-g6-strong-limit.yml'

permissions:
  contents: read

jobs:
  lane:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        mode:
          - torsion-jacobian-exact
          - l2-strong-continuity
          - dense-domain-extension
          - trace-class-channel-limit
          - serial-accumulation
          - c6-identifiability-decision
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Run lane
        shell: bash
        run: |
          mkdir -p build/g6
          case '${{ matrix.mode }}' in
            torsion-jacobian-exact) python code/qgr_iter009_g6_torsion_jacobian_exact.py > build/g6/result.json ;;
            l2-strong-continuity) python code/qgr_iter009_g6_l2_strong_continuity.py > build/g6/result.json ;;
            dense-domain-extension) python code/qgr_iter009_g6_dense_domain_extension.py > build/g6/result.json ;;
            trace-class-channel-limit) python code/qgr_iter009_g6_trace_class_channel_limit.py > build/g6/result.json ;;
            serial-accumulation) python code/qgr_iter009_g6_serial_accumulation.py > build/g6/result.json ;;
            c6-identifiability-decision) python code/qgr_iter009_g6_c6_identifiability_decision.py > build/g6/result.json ;;
          esac
          cat build/g6/result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter009-g6-${{ matrix.mode }}
          path: build/g6/result.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: lane
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: qgr-iter009-g6-*
          path: iter009-g6-results
          merge-multiple: false
      - name: Aggregate
        run: python code/qgr_iter009_g6_aggregate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter009-g6-summary
          path: iter009-g6-summary.json
          if-no-files-found: error
          retention-days: 90
