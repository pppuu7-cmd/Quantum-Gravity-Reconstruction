name: qgr-iter008-g4-interacting-scale

on:
  push:
    paths:
      - 'code/qgr_iter008_g4_*.py'
      - '.github/workflows/qgr-iter008-g4-interacting-scale.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lane:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frozen-normalization
            script: code/qgr_iter008_g4_frozen_normalization.py
            output: iter008-g4-frozen-normalization.json
          - name: deparametrization
            script: code/qgr_iter008_g4_deparametrization.py
            output: iter008-g4-deparametrization.json
          - name: z2-sector
            script: code/qgr_iter008_g4_z2_sector.py
            output: iter008-g4-z2-sector.json
          - name: loop-phase
            script: code/qgr_iter008_g4_loop_phase.py
            output: iter008-g4-loop-phase.json
          - name: clock-backreaction
            script: code/qgr_iter008_g4_clock_backreaction.py
            output: iter008-g4-clock-backreaction.json
    runs-on: ubuntu-24.04
    name: lane (${{ matrix.name }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Run lane
        run: python "${{ matrix.script }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter008-g4-${{ matrix.name }}
          path: ${{ matrix.output }}
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: lane
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: qgr-iter008-g4-*
          path: iter008-g4-results
          merge-multiple: false
      - name: Aggregate
        run: python code/qgr_iter008_g4_aggregate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter008-g4-summary
          path: iter008-g4-summary.json
          if-no-files-found: error
          retention-days: 90
