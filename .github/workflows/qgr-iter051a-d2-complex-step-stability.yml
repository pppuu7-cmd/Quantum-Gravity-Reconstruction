name: qgr-iter051a-d2-complex-step-stability
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/qgr-iter051a-d2-complex-step-stability.yml'
  workflow_dispatch:

jobs:
  lane:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        lane: [0,2,9]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy
      - name: Run frozen Iter051A-D2 lane
        run: |
          set -o pipefail
          python code/qgr_iter051a_d2_complex_step_stability.py --lane ${{ matrix.lane }} | tee lane.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qgr-iter051a-d2-lane-${{ matrix.lane }}
          path: lane.json

  aggregate:
    needs: lane
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: qgr-iter051a-d2-lane-*
          path: artifacts
          merge-multiple: false
      - name: Frozen diagnostic classification
        run: python code/qgr_iter051a_d2_aggregate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qgr-iter051a-d2-summary
          path: iter051a-d2-summary.json
