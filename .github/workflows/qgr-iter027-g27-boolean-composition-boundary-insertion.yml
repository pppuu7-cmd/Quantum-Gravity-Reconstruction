name: qgr-iter027-g27-boolean-composition-boundary-insertion
on:
  push:
    paths:
      - 'code/qgr_iter027_g27_boolean_composition_boundary_insertion.py'
      - 'code/qgr_iter027_g27_aggregate.py'
      - '.github/workflows/qgr-iter027-g27-boolean-composition-boundary-insertion.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lane:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 30
      matrix:
        audit: [additive-valuation, multiplicative-character, prefix-scale-blindness, boundary-coboundary, composition-ratios]
        lane: [0,1,2,3,4,5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: G27 primitive Boolean composition boundary-insertion audit
        run: |
          mkdir -p out
          python code/qgr_iter027_g27_boolean_composition_boundary_insertion.py --audit '${{ matrix.audit }}' --lane '${{ matrix.lane }}' --out out/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: qgr-g27-${{ matrix.audit }}-${{ matrix.lane }}
          path: out/result.json
  aggregate:
    needs: lane
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: qgr-g27-*
          path: iter027-g27-results
          merge-multiple: false
      - name: Aggregate 30 G27 lanes
        run: python code/qgr_iter027_g27_aggregate.py
      - uses: actions/upload-artifact@v4
        with:
          name: qgr-g27-summary
          path: iter027-g27-summary/summary.json
