name: qgr-iter057w-decic-einstein-seed

on:
  push:
    paths:
      - '.github/workflows/qgr-iter057w-decic-einstein-seed.yml'
  workflow_dispatch:

jobs:
  exact-decic-seed:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check sympy
      - name: Solve and independently replay unrestricted decic Einstein seed
        run: |
          mkdir -p out
          PYTHONPATH=code python code/qgr_iter057w_decic_einstein_seed_completion.py --out out/iter057w.json
      - name: Show classification
        if: always()
        run: cat out/iter057w.json || true
      - name: Upload exact decic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iter057w-decic-einstein-seed
          path: out/iter057w.json
          if-no-files-found: warn
