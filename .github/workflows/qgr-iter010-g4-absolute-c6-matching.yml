name: qgr-iter010-g4-absolute-c6-matching

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/qgr_iter010_g4_*.py'
      - 'code/qgr_iter010_g3_common.py'
      - '.github/workflows/qgr-iter010-g4-absolute-c6-matching.yml'

permissions:
  contents: read

jobs:
  lane:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        mode:
          - two-derivative-normalization
          - history-phase-c6-nofix
          - continuous-loop-noquantization
          - refinement-homogeneity
          - absolute-phase-sensitivity
          - nonhomogeneous-authority-scan
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Install numeric dependencies for Weyl-active lane
        if: matrix.mode == 'absolute-phase-sensitivity'
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Run lane
        shell: bash
        run: |
          mkdir -p build/g4
          case '${{ matrix.mode }}' in
            two-derivative-normalization) python code/qgr_iter010_g4_two_derivative_normalization_separation.py > build/g4/result.json ;;
            history-phase-c6-nofix) python code/qgr_iter010_g4_history_phase_c6_nofix.py > build/g4/result.json ;;
            continuous-loop-noquantization) python code/qgr_iter010_g4_continuous_loop_c6_noquantization.py > build/g4/result.json ;;
            refinement-homogeneity) python code/qgr_iter010_g4_refinement_homogeneity.py > build/g4/result.json ;;
            absolute-phase-sensitivity) python code/qgr_iter010_g4_absolute_phase_sensitivity.py > build/g4/result.json ;;
            nonhomogeneous-authority-scan) python code/qgr_iter010_g4_nonhomogeneous_authority_scan.py > build/g4/result.json ;;
          esac
          cat build/g4/result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter010-g4-${{ matrix.mode }}
          path: build/g4/result.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: lane
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: qgr-iter010-g4-*
          path: iter010-g4-results
          merge-multiple: false
      - name: Aggregate
        run: python code/qgr_iter010_g4_aggregate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter010-g4-summary
          path: iter010-g4-summary.json
          if-no-files-found: error
          retention-days: 90
