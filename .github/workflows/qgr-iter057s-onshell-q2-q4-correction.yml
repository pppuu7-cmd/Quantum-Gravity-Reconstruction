name: qgr-iter057s-onshell-q2-q4-correction

on:
  push:
    paths:
      - '.github/workflows/qgr-iter057s-onshell-q2-q4-correction.yml'
  workflow_dispatch:

jobs:
  exact-onshell-correction:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check sympy
      - name: Solve corrected-source Q2/Q4 system and run full-seed unreduced control
        run: |
          mkdir -p out
          PYTHONPATH=code python code/qgr_iter057s_onshell_q2_q4_correction.py --out out/iter057s.json
      - name: Show exact classification
        if: always()
        run: cat out/iter057s.json || true
      - name: Upload exact on-shell correction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iter057s-onshell-q2-q4-correction
          path: out/iter057s.json
          if-no-files-found: warn
