name: QGR Iter057AO covariant directional probe
on:
  push:
    paths:
      - 'scripts/qgr_iter057ao_covariant_directional_probe.py'
      - '.github/workflows/qgr-iter057ao-covariant-directional-probe.yml'
  workflow_dispatch:
jobs:
  exact-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install sympy
      - name: Exact source-level covariant directional probe
        run: |
          mkdir -p artifacts/iter057ao
          python scripts/qgr_iter057ao_covariant_directional_probe.py | tee artifacts/iter057ao/iter057ao_phase1.json
      - uses: actions/upload-artifact@v4
        with:
          name: iter057ao-covariant-directional-probe
          path: artifacts/iter057ao/iter057ao_phase1.json
          if-no-files-found: error
