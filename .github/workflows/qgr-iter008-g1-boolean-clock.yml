name: qgr-iter008-g1-boolean-clock

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/qgr_iter008_g1_*.py'
      - '.github/workflows/qgr-iter008-g1-boolean-clock.yml'

permissions:
  contents: read

jobs:
  lane:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        mode: [uniqueness, causality, serial, dual]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Run lane
        shell: bash
        run: |
          mkdir -p build/g1
          case '${{ matrix.mode }}' in
            uniqueness) python code/qgr_iter008_g1_rank_clock_uniqueness.py --output build/g1/result.json ;;
            causality) python code/qgr_iter008_g1_rank_clock_causality.py --output build/g1/result.json ;;
            serial) python code/qgr_iter008_g1_rank_clock_serial_composition.py --output build/g1/result.json ;;
            dual) python code/qgr_iter008_g1_rank_clock_dual_frequency.py --output build/g1/result.json ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter008-g1-${{ matrix.mode }}
          path: build/g1/result.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: lane
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: qgr-iter008-g1-*
          path: iter008-g1-results
      - run: python code/qgr_iter008_g1_aggregate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter008-g1-summary
          path: iter008-g1-summary.json
          if-no-files-found: error
          retention-days: 90
