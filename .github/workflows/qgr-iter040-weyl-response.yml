name: qgr-iter040-weyl-response

on:
  push:
    paths:
      - 'status/ITERATION_040_TRIGGER.txt'
  workflow_dispatch:

jobs:
  stream-a:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        index: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: A refinement null sign structure
        run: |
          mkdir -p out
          python code/qgr_iter040_weyl_response.py --stream A --index '${{ matrix.index }}' --out out/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qgr-iter040-A-${{ matrix.index }}
          path: out/result.json

  stream-b:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        index: [0,1,2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: B amplitude power law
        run: |
          mkdir -p out
          python code/qgr_iter040_weyl_response.py --stream B --index '${{ matrix.index }}' --out out/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qgr-iter040-B-${{ matrix.index }}
          path: out/result.json

  stream-c:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        index: [0,1,2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: C shape ratio universality
        run: |
          mkdir -p out
          python code/qgr_iter040_weyl_response.py --stream C --index '${{ matrix.index }}' --out out/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qgr-iter040-C-${{ matrix.index }}
          path: out/result.json

  stream-d:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        index: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: D rotational invariance recovery
        run: |
          mkdir -p out
          python code/qgr_iter040_weyl_response.py --stream D --index '${{ matrix.index }}' --out out/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qgr-iter040-D-${{ matrix.index }}
          path: out/result.json

  stream-e:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        index: [0,1,2,3,4,5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: E exact calibration-free relations
        run: |
          mkdir -p out
          python code/qgr_iter040_weyl_response.py --stream E --index '${{ matrix.index }}' --out out/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qgr-iter040-E-${{ matrix.index }}
          path: out/result.json

  aggregate:
    if: always()
    needs: [stream-a,stream-b,stream-c,stream-d,stream-e]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: qgr-iter040-*
          path: iter040-results
          merge-multiple: false
      - name: Aggregate frozen Iter040 gate
        run: python code/qgr_iter040_aggregate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qgr-iter040-summary
          path: iter040-summary/summary.json
