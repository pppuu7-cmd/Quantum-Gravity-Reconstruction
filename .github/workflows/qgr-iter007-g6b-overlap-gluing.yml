name: qgr-iter007-g6b-overlap-gluing

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/qgr_iter007_g6b_*.py'
      - '.github/workflows/qgr-iter007-g6b-overlap-gluing.yml'

permissions:
  contents: read

jobs:
  lane:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        mode: [gluing-support, composability, serial-measure, rectangular-paths, curved-spread]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Run lane
        shell: bash
        run: |
          mkdir -p build/g6b
          case '${{ matrix.mode }}' in
            gluing-support) python code/qgr_iter007_g6b_cubical_gluing_support.py --output build/g6b/result.json ;;
            composability) python code/qgr_iter007_g6b_diagonal_composability.py --output build/g6b/result.json ;;
            serial-measure) python code/qgr_iter007_g6b_serial_instrument_measure.py --output build/g6b/result.json ;;
            rectangular-paths) python code/qgr_iter007_g6b_rectangular_overlap_paths.py --output build/g6b/result.json ;;
            curved-spread) python code/qgr_iter007_g6b_g9_curved_history_spread.py --output build/g6b/result.json ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter007-g6b-${{ matrix.mode }}
          path: build/g6b/result.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: lane
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: qgr-iter007-g6b-*
          path: iter007-g6b-results
      - run: python code/qgr_iter007_g6b_aggregate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter007-g6b-summary
          path: iter007-g6b-summary.json
          if-no-files-found: error
          retention-days: 90
