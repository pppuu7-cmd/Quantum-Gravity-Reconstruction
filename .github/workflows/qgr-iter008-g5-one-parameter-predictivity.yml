name: qgr-iter008-g5-one-parameter-predictivity

on:
  push:
    paths:
      - 'code/qgr_iter008_g5_*.py'
      - '.github/workflows/qgr-iter008-g5-one-parameter-predictivity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lane:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: parameter-count
            script: code/qgr_iter008_g5_parameter_count.py
            output: iter008-g5-parameter-count.json
          - name: relative-ratio
            script: code/qgr_iter008_g5_relative_ratio.py
            output: iter008-g5-relative-ratio.json
          - name: conditional-bound
            script: code/qgr_iter008_g5_conditional_bound.py
            output: iter008-g5-conditional-bound.json
          - name: local-z2-invisibility
            script: code/qgr_iter008_g5_local_z2_invisibility.py
            output: iter008-g5-local-z2-invisibility.json
          - name: global-z2-loop
            script: code/qgr_iter008_g5_global_z2_loop.py
            output: iter008-g5-global-z2-loop.json
    runs-on: ubuntu-24.04
    name: lane (${{ matrix.name }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Run lane
        run: python "${{ matrix.script }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter008-g5-${{ matrix.name }}
          path: ${{ matrix.output }}
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: lane
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: qgr-iter008-g5-*
          path: iter008-g5-results
          merge-multiple: false
      - name: Aggregate
        run: python code/qgr_iter008_g5_aggregate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter008-g5-summary
          path: iter008-g5-summary.json
          if-no-files-found: error
          retention-days: 90
