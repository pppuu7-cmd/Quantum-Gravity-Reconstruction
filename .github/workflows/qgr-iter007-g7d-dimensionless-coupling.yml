name: qgr-iter007-g7d-dimensionless-coupling

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/qgr_iter007_g7d_*.py'
      - '.github/workflows/qgr-iter007-g7d-dimensionless-coupling.yml'

permissions:
  contents: read

jobs:
  lane:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        mode: [reparameterization, history-form, vacuum-normalization, g-authority]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Run lane
        shell: bash
        run: |
          mkdir -p build/g7d
          case '${{ matrix.mode }}' in
            reparameterization) python code/qgr_iter007_g7d_dimensionless_reparam.py --output build/g7d/result.json ;;
            history-form) python code/qgr_iter007_g7d_history_dimensionless_form.py --output build/g7d/result.json ;;
            vacuum-normalization) python code/qgr_iter007_g7d_vacuum_normalization_audit.py --output build/g7d/result.json ;;
            g-authority) python code/qgr_iter007_g7d_g_authority_guard.py --output build/g7d/result.json ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter007-g7d-${{ matrix.mode }}
          path: build/g7d/result.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: lane
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: qgr-iter007-g7d-*
          path: iter007-g7d-results
      - run: python code/qgr_iter007_g7d_aggregate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter007-g7d-summary
          path: iter007-g7d-summary.json
          if-no-files-found: error
          retention-days: 90
