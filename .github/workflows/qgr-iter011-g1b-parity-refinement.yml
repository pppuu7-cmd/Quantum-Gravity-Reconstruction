name: qgr-iter011-g1b-parity-refinement

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/qgr_iter011_g1b_*.py'
      - '.github/workflows/qgr-iter011-g1b-parity-refinement.yml'

permissions:
  contents: read

jobs:
  lane:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        h: ['0.25','0.125','0.0625']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - run: python -m pip install --disable-pip-version-check numpy scipy
      - run: |
          mkdir -p build/g1b
          python code/qgr_iter011_g1b_parity_refinement.py --h '${{ matrix.h }}' > build/g1b/result.json
          cat build/g1b/result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter011-g1b-h${{ matrix.h }}
          path: build/g1b/result.json
          retention-days: 90
  aggregate:
    needs: lane
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: qgr-iter011-g1b-*
          path: iter011-g1b-results
          merge-multiple: false
      - run: python code/qgr_iter011_g1b_aggregate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter011-g1b-summary
          path: iter011-g1b-summary.json
          retention-days: 90
