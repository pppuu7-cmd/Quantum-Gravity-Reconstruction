name: qgr-iter010-g2-finite-cell-census

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/qgr_iter010_g2_*.py'
      - '.github/workflows/qgr-iter010-g2-finite-cell-census.yml'

permissions:
  contents: read

jobs:
  lane:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        mode:
          - g9-conformal-obstruction
          - holonomy-curvature-scaling
          - weyl-proxy-vanishing
          - cell-weyl3-scaling
          - finite-cell-orbit-ambiguity
          - normalization-homogeneity
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Install numeric dependencies
        if: matrix.mode == 'holonomy-curvature-scaling' || matrix.mode == 'weyl-proxy-vanishing' || matrix.mode == 'cell-weyl3-scaling'
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Run lane
        shell: bash
        run: |
          mkdir -p build/g2
          case '${{ matrix.mode }}' in
            g9-conformal-obstruction) python code/qgr_iter010_g2_g9_conformal_obstruction.py > build/g2/result.json ;;
            holonomy-curvature-scaling) python code/qgr_iter010_g2_holonomy_curvature_scaling.py > build/g2/result.json ;;
            weyl-proxy-vanishing) python code/qgr_iter010_g2_weyl_proxy_vanishing.py > build/g2/result.json ;;
            cell-weyl3-scaling) python code/qgr_iter010_g2_cell_weyl3_scaling.py > build/g2/result.json ;;
            finite-cell-orbit-ambiguity) python code/qgr_iter010_g2_finite_cell_orbit_ambiguity.py > build/g2/result.json ;;
            normalization-homogeneity) python code/qgr_iter010_g2_normalization_homogeneity.py > build/g2/result.json ;;
          esac
          cat build/g2/result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter010-g2-${{ matrix.mode }}
          path: build/g2/result.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: lane
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: qgr-iter010-g2-*
          path: iter010-g2-results
          merge-multiple: false
      - name: Aggregate
        run: python code/qgr_iter010_g2_aggregate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter010-g2-summary
          path: iter010-g2-summary.json
          if-no-files-found: error
          retention-days: 90
