name: qgr-iter007-g6d-common-target-readout

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/qgr_iter007_g6d_*.py'
      - '.github/workflows/qgr-iter007-g6d-common-target-readout.yml'

permissions:
  contents: read

jobs:
  lane:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        mode: [null-bundle, null-measure, seed-norm, purity-identity]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Run lane
        shell: bash
        run: |
          mkdir -p build/g6d
          case '${{ matrix.mode }}' in
            null-bundle) python code/qgr_iter007_g6d_curved_null_bundle_gram.py --output build/g6d/result.json ;;
            null-measure) python code/qgr_iter007_g6d_null_cone_measure.py --output build/g6d/result.json ;;
            seed-norm) python code/qgr_iter007_g6d_seed_norm_covariance_audit.py --output build/g6d/result.json ;;
            purity-identity) python code/qgr_iter007_g6d_conditional_purity_identity.py --output build/g6d/result.json ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter007-g6d-${{ matrix.mode }}
          path: build/g6d/result.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: lane
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: qgr-iter007-g6d-*
          path: iter007-g6d-results
      - run: python code/qgr_iter007_g6d_aggregate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter007-g6d-summary
          path: iter007-g6d-summary.json
          if-no-files-found: error
          retention-days: 90
