name: QGR Iter057AF complete aggregate Windows fallback

on:
  workflow_run:
    workflows: ["QGR Iter057AF lane7 shard1 Windows reproduction"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: qgr-iter057af-complete-aggregate-fallback
  cancel-in-progress: false

env:
  AF_PRIMARY_RUN: '35118287075'
  AF_EVALUATOR_HEAD: '57b8e0f61e1d77c19eca09a2bd34f48921ffc020'
  AD_SOURCE_RUN: '35070896151'

jobs:
  aggregate-fallback:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GH_TOKEN: ${{ github.token }}
      WIN_RUN: ${{ github.event.workflow_run.id }}
      WIN_WORKFLOW_HEAD: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact algebra backends
        run: python -m pip install --disable-pip-version-check sympy python-flint
      - name: Download frozen mixed-run shard set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p iter057af-input/old iter057af-input/af iter057af-input/original7 iter057af-output
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${AF_PRIMARY_RUN}" > iter057af-output/primary_run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${AF_PRIMARY_RUN}/artifacts?per_page=100" > iter057af-output/primary_artifacts.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${WIN_RUN}" > iter057af-output/windows_run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${WIN_RUN}/artifacts?per_page=100" > iter057af-output/windows_artifacts.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${AD_SOURCE_RUN}/artifacts?per_page=100" > iter057af-output/ad_artifacts.json
          python - <<'PY'
          import json,pathlib,os
          pr=json.load(open('iter057af-output/primary_run.json')); pa=json.load(open('iter057af-output/primary_artifacts.json'))['artifacts']; wa=json.load(open('iter057af-output/windows_artifacts.json'))['artifacts']; ad=json.load(open('iter057af-output/ad_artifacts.json'))['artifacts']
          if pr.get('head_sha')!='57b8e0f61e1d77c19eca09a2bd34f48921ffc020': raise SystemExit('primary AF head mismatch')
          p={a['name']:a for a in pa}; w={a['name']:a for a in wa}; amap={a['id']:a for a in ad}
          needed_primary={0:p.get('iter057af-lane7-0'),2:p.get('iter057af-lane7-2'),3:p.get('iter057af-lane7-3')}; win=w.get('iter057af-lane7-1-windows')
          if any(v is None or v.get('expired') for v in needed_primary.values()) or win is None or win.get('expired'): raise SystemExit('missing mixed AF artifact')
          old=[0,10444152126,10442437521,10442003071,10444770687,10443729361,10443653309,10443899697]
          if any(amap.get(i) is None or amap[i].get('expired') for i in old[1:]): raise SystemExit('missing old AD artifact')
          orig=amap.get(10440479824)
          if orig is None or orig.get('expired'): raise SystemExit('missing original lane7 diagnostic')
          manifest={'primary_run':int(os.environ['AF_PRIMARY_RUN']),'primary_head':pr.get('head_sha'),'windows_run':int(os.environ['WIN_RUN']),'windows_workflow_head':os.environ['WIN_WORKFLOW_HEAD'],'scientific_evaluator_head':'57b8e0f61e1d77c19eca09a2bd34f48921ffc020','primary_artifacts':{str(k):{'id':int(v['id']),'digest':v.get('digest')} for k,v in needed_primary.items()},'windows_artifact':{'slot':1,'id':int(win['id']),'digest':win.get('digest')}}
          pathlib.Path('iter057af-output/source_manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          lines=[f"0 {needed_primary[0]['id']}",f"1 {win['id']}",f"2 {needed_primary[2]['id']}",f"3 {needed_primary[3]['id']}"]
          pathlib.Path('iter057af-output/af_ids.txt').write_text('\n'.join(lines)+'\n')
          PY
          download_extract() {
            id="$1"; dest="$2"; zip="${dest}.zip"; mkdir -p "$dest"
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" -o "$zip"
            python -m zipfile -e "$zip" "$dest"
          }
          download_extract 10444152126 iter057af-input/old/0
          download_extract 10442437521 iter057af-input/old/1
          download_extract 10442003071 iter057af-input/old/2
          download_extract 10444770687 iter057af-input/old/3
          download_extract 10443729361 iter057af-input/old/4
          download_extract 10443653309 iter057af-input/old/5
          download_extract 10443899697 iter057af-input/old/6
          download_extract 10440479824 iter057af-input/original7
          while read -r slot id; do download_extract "$id" "iter057af-input/af/${slot}"; done < iter057af-output/af_ids.txt
      - name: Produce exact complete aggregate
        shell: bash
        run: |
          set +e
          PYTHONPATH=code python scripts/qgr_iter057af_complete_aggregate.py \
            --old-root iter057af-input/old \
            --af-root iter057af-input/af \
            --original-lane7-root iter057af-input/original7 \
            --source-run "${WIN_RUN}" \
            --source-head "${AF_EVALUATOR_HEAD}" \
            --output iter057af-output/terminal_aggregate.json
          code=$?
          echo "$code" > iter057af-output/evaluator_exit_code.txt
          cat iter057af-output/terminal_aggregate.json
          exit 0
      - name: Upload terminal aggregate authority candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iter057af-complete-obstruction-aggregate-windows-fallback
          path: iter057af-output/
          if-no-files-found: error
          retention-days: 30
