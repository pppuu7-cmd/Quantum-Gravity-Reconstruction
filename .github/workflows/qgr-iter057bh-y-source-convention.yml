name: QGR Iter057BH Y source-equation convention adjudication
on:
  push:
    paths:
      - '.github/workflows/qgr-iter057bh-y-source-convention.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qgr-iter057bh-y-source-convention
  cancel-in-progress: false
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Frozen static semantic/dataflow adjudication
        run: |
          mkdir -p artifacts/iter057bh/static
          python scripts/qgr_iter057bh_static_convention.py --repo . --output artifacts/iter057bh/static/static.json | tee artifacts/iter057bh/static/static.log
          sha256sum artifacts/iter057bh/static/* > artifacts/iter057bh/static/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter057bh-static
          path: artifacts/iter057bh/static/
          if-no-files-found: error
          retention-days: 30
  exact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned exact dependency
        run: python -m pip install --disable-pip-version-check sympy
      - name: Fresh pinned AQ cells and exact 840-slot convention comparison
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/iter057bh/exact
          git worktree add --detach _aq c04cc004b9ef5aadcef70fd25d5129a80670335d
          PYTHONPATH=_aq/code python _aq/code/qgr_iter057aq_degree6_causal_adjudication.py --output artifacts/iter057bh/exact/fresh-aq.json > artifacts/iter057bh/exact/fresh-aq.log 2>&1
          rc_aq=$?
          python scripts/qgr_iter057bh_exact_convention.py \
            --aq-output artifacts/iter057bh/exact/fresh-aq.json \
            --x-source data/ITER057X_CANONICAL_SOURCE_DEGREE6.csv \
            --at-source data/ITER057AT_CANONICAL_SOURCE_DEGREE6.csv \
            --output artifacts/iter057bh/exact/exact.json \
            > artifacts/iter057bh/exact/exact.log 2>&1
          rc_cmp=$?
          printf '%s\n' "$rc_aq" > artifacts/iter057bh/exact/fresh-aq-exitcode.txt
          printf '%s\n' "$rc_cmp" > artifacts/iter057bh/exact/exact-exitcode.txt
          cat artifacts/iter057bh/exact/fresh-aq.log
          cat artifacts/iter057bh/exact/exact.log
          sha256sum artifacts/iter057bh/exact/* > artifacts/iter057bh/exact/SHA256SUMS.txt 2>/dev/null || true
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter057bh-exact
          path: artifacts/iter057bh/exact/
          if-no-files-found: warn
          retention-days: 30
  terminal:
    if: always()
    needs: [static, exact]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: iter057bh-*
          path: collected
          merge-multiple: false
      - name: Frozen Iter057BH terminal classifier
        shell: bash
        run: |
          mkdir -p terminal
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          GATE='ITER057BH_ITER057Y_SOURCE_EQUATION_CONVENTION_ADJUDICATION'
          PREREG='4317e8d2dce74178ecddab100374455c933959c4'
          PLUS='PASS_SCOPED_ITER057BH_Y_SOURCE_CONVENTION_MAP_PLUS_AT_INDEPENDENTLY_ESTABLISHED'
          MINUS='PASS_SCOPED_ITER057BH_Y_SOURCE_CONVENTION_MAP_MINUS_AT_INDEPENDENTLY_ESTABLISHED'
          BLOCKED='BLOCKED_ITER057BH_Y_SOURCE_CONVENTION_UNRESOLVED'
          FAIL='FAIL_TECHNICAL_ITER057BH_STATIC_AND_EXACT_CONVENTION_EVIDENCE_DISAGREE'
          INVALID='INVALID_ITER057BH_CORRECTED_Y_OUTCOME_LEAKAGE_HISTORY_MUTATION_OR_POSTHOC_MAP'
          def load(name,file):
              p=Path('collected')/name/file
              if not p.exists() or not p.stat().st_size:return None
              try:return json.loads(p.read_text())
              except Exception:return None
          def sh(x):return hashlib.sha256(json.dumps(x,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          s=load('iter057bh-static','static.json');e=load('iter057bh-exact','exact.json')
          out={'gate':GATE,'preregistration_commit':PREREG,'green_ci_alone_is_not_pass':True}
          if s is None or e is None:
              out.update(classification=BLOCKED,reason='static or exact convention payload missing/invalid')
          else:
              sc=s.get('controls',{});ec=e.get('controls',{})
              forbidden=any([s.get('corrected_y_science_consumed') is not False,e.get('corrected_y_science_consumed') is not False,sc.get('historical_file_modified') is not False,ec.get('historical_file_modified') is not False,sc.get('claim_lock_promoted') is not False,ec.get('claim_lock_promoted') is not False,ec.get('no_sign_scale_fit') is not True,ec.get('corrected_y_response_not_executed') is not True])
              smap=s.get('corrected_source_map');emap=e.get('corrected_source_map')
              controls={
                'parent_prereg_exact':s.get('preregistration_commit')==PREREG and e.get('preregistration_commit')==PREREG,
                'static_all_controls_pass':s.get('all_controls_pass') is True,
                'exact_all_controls_pass':e.get('all_controls_pass') is True,
                'static_exact_map_agreement':smap==emap and smap in {'MAP_PLUS','MAP_MINUS'},
                'x_relation_exact_same_or_negative':e.get('historical_x_relation_to_ox_pl') in {'SAME','NEGATIVE'},
                'at_equals_fresh_ox_pf':e.get('corrected_at_relation_to_ox_pf')=='SAME',
                'at_vector_sha_exact':e.get('at_full_840_vector_sha256')==e.get('ox_pf_degree6_vector_sha256')=='5d070732d90b864f6167e03da85b86ce531d127dc9442fdbb928fd1b6153ee6b',
                'ox_pl_oao_pl_exact':e.get('ox_pl_oao_pl_relation')=='SAME',
                'ox_pf_oao_pf_exact':e.get('ox_pf_oao_pf_relation')=='SAME',
                'historical_y_equation_semantics_exact':s.get('y_field_equation')=='DG_MINUS_SOURCE_EQUALS_ZERO',
                'no_corrected_y_outcome_consumed':s.get('corrected_y_science_consumed') is False and e.get('corrected_y_science_consumed') is False,
              }
              unresolved=smap not in {'MAP_PLUS','MAP_MINUS'} or emap not in {'MAP_PLUS','MAP_MINUS'}
              if forbidden:
                  cls=INVALID;reason='corrected-Y outcome leakage, history mutation, or post-hoc sign/scale map detected'
              elif unresolved:
                  cls=BLOCKED;reason='frozen static/exact evidence does not distinguish MAP_PLUS from MAP_MINUS'
              elif not all(controls.values()):
                  cls=FAIL;reason='static and exact convention evidence disagree or a frozen exactness/integrity control failed'
              elif smap=='MAP_PLUS':
                  cls=PLUS;reason='historical Y source convention is +Edown; corrected source is +AT, independently established before any corrected-Y solve'
              else:
                  cls=MINUS;reason='historical Y source convention is -Edown; corrected source is -AT, independently established before any corrected-Y solve'
              out.update({'classification':cls,'reason':reason,'controls':controls,'corrected_source_map':smap if cls in {PLUS,MINUS} else None,'corrected_source_expression':s.get('implied_corrected_source_expression') if cls in {PLUS,MINUS} else None,'historical_x_relation_to_ox_pl':e.get('historical_x_relation_to_ox_pl'),'corrected_at_relation_to_ox_pf':e.get('corrected_at_relation_to_ox_pf'),'historical_y_field_equation':s.get('y_field_equation'),'degree6_rhs_source_contribution':s.get('implied_degree6_rhs_source_contribution') if cls in {PLUS,MINUS} else None,'x_full_840_vector_sha256':e.get('x_full_840_vector_sha256'),'at_full_840_vector_sha256':e.get('at_full_840_vector_sha256'),'x_csv_sha256':e.get('x_csv_sha256'),'at_csv_sha256':e.get('at_csv_sha256'),'static_payload_sha256':sh(s),'exact_payload_sha256':sh(e),'corrected_y_science_consumed':False,'historical_iter057x_reclassified':False,'historical_iter057y_reclassified':False,'theory_established_pct':0,'c6':'SYMBOLIC_UNFIXED'})
          body=dict(out);out['terminal_payload_sha256']=sh(body)
          Path('terminal/terminal.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n')
          print(json.dumps(out,sort_keys=True,indent=2))
          PY
          sha256sum terminal/terminal.json > terminal/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter057bh-terminal
          path: terminal/
          if-no-files-found: error
          retention-days: 30
