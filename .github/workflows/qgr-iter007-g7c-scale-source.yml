name: qgr-iter007-g7c-scale-source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/qgr_iter007_g7c_*.py'
      - '.github/workflows/qgr-iter007-g7c-scale-source.yml'

permissions:
  contents: read

jobs:
  lane:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        mode: [regulator-fork, continuous-scale, cotangent, combinatorics]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Run lane
        shell: bash
        run: |
          mkdir -p build/g7c
          case '${{ matrix.mode }}' in
            regulator-fork) python code/qgr_iter007_g7c_regulator_physical_fork.py --output build/g7c/result.json ;;
            continuous-scale) python code/qgr_iter007_g7c_continuous_geometry_scale_audit.py --output build/g7c/result.json ;;
            cotangent) python code/qgr_iter007_g7c_cotangent_prequantization_audit.py --output build/g7c/result.json ;;
            combinatorics) python code/qgr_iter007_g7c_combinatorial_scale_audit.py --output build/g7c/result.json ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter007-g7c-${{ matrix.mode }}
          path: build/g7c/result.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: lane
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: qgr-iter007-g7c-*
          path: iter007-g7c-results
      - run: python code/qgr_iter007_g7c_aggregate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter007-g7c-summary
          path: iter007-g7c-summary.json
          if-no-files-found: error
          retention-days: 90
