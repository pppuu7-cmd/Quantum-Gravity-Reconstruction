name: qgr-iter011-g3-measure-sector

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/qgr_iter011_g3_*.py'
      - '.github/workflows/qgr-iter011-g3-measure-sector.yml'

permissions:
  contents: read

jobs:
  lane:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        mode: [centered-full-coarea, haar-lie-algebra, generic-local-hierarchy, power-count-phase-separation]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Install numeric dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Run G3 lane
        shell: bash
        env:
          PYTHONPATH: code
        run: |
          mkdir -p build/g3
          case '${{ matrix.mode }}' in
            centered-full-coarea) python code/qgr_iter011_g3_centered_full_coarea.py > build/g3/result.json ;;
            haar-lie-algebra) python code/qgr_iter011_g3_haar_lie_algebra.py > build/g3/result.json ;;
            generic-local-hierarchy) python code/qgr_iter011_g3_generic_local_hierarchy.py > build/g3/result.json ;;
            power-count-phase-separation) python code/qgr_iter011_g3_power_count_and_phase.py > build/g3/result.json ;;
          esac
          python -m json.tool build/g3/result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter011-g3-${{ matrix.mode }}
          path: build/g3/result.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: lane
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: qgr-iter011-g3-*
          path: iter011-g3-results
          merge-multiple: false
      - name: Aggregate classifications
        shell: bash
        run: |
          python - <<'PY'
          import glob,json,os
          rows=[]
          for p in sorted(glob.glob('iter011-g3-results/*/result.json')):
              with open(p) as f: d=json.load(f)
              rows.append({'artifact':os.path.basename(os.path.dirname(p)),'gate':d.get('gate'),'classification':d.get('classification'),'guard':d.get('guard')})
          assert len(rows)==4, rows
          out={'gate':'ITER011-G3-MEASURE-SECTOR-AGGREGATE','lanes':rows,'all_lane_outputs_valid':True,'classification':'PASS_INFRASTRUCTURE_G3_FOUR_LANE_RESULTS_COLLECTED__SCIENTIFIC_INTERPRETATION_REQUIRES_LANE_CLASSIFICATIONS'}
          with open('iter011-g3-summary.json','w') as f: json.dump(out,f,indent=2,sort_keys=True)
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter011-g3-summary
          path: iter011-g3-summary.json
          if-no-files-found: error
          retention-days: 90
