name: qgr-iter011-g1-torsion-jacobian

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/qgr_iter011_g1_*.py'
      - '.github/workflows/qgr-iter011-g1-torsion-jacobian.yml'

permissions:
  contents: read

jobs:
  lane:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        mode: [refinement-scaling, amplitude-parity, local-composition]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Install numeric dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Run lane
        shell: bash
        run: |
          mkdir -p build/g1
          case '${{ matrix.mode }}' in
            refinement-scaling) python code/qgr_iter011_g1_refinement_scaling.py > build/g1/result.json ;;
            amplitude-parity) python code/qgr_iter011_g1_amplitude_parity.py > build/g1/result.json ;;
            local-composition) python code/qgr_iter011_g1_local_composition.py > build/g1/result.json ;;
          esac
          cat build/g1/result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter011-g1-${{ matrix.mode }}
          path: build/g1/result.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: lane
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: qgr-iter011-g1-*
          path: iter011-g1-results
          merge-multiple: false
      - name: Aggregate
        run: python code/qgr_iter011_g1_aggregate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter011-g1-summary
          path: iter011-g1-summary.json
          if-no-files-found: error
          retention-days: 90
