name: qgr-iter011-g2-glued-coarea

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/qgr_iter011_g2_*.py'
      - '.github/workflows/qgr-iter011-g2-glued-coarea.yml'

permissions:
  contents: read

jobs:
  lane:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        mode: [unique-anchor-gluing, reparametrization, curvature2-bulk-quotient, history-common-factor]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Install numeric dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Run lane
        shell: bash
        run: |
          mkdir -p build/g2
          case '${{ matrix.mode }}' in
            unique-anchor-gluing) python code/qgr_iter011_g2_unique_anchor_gluing.py > build/g2/result.json ;;
            reparametrization) python code/qgr_iter011_g2_flat_subtracted_reparam.py > build/g2/result.json ;;
            curvature2-bulk-quotient) python code/qgr_iter011_g2_curvature2_bulk_quotient.py > build/g2/result.json ;;
            history-common-factor) python code/qgr_iter011_g2_history_common_factor.py > build/g2/result.json ;;
          esac
          cat build/g2/result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter011-g2-${{ matrix.mode }}
          path: build/g2/result.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: lane
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: qgr-iter011-g2-*
          path: iter011-g2-results
          merge-multiple: false
      - name: Aggregate
        run: python code/qgr_iter011_g2_aggregate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter011-g2-summary
          path: iter011-g2-summary.json
          if-no-files-found: error
          retention-days: 90
