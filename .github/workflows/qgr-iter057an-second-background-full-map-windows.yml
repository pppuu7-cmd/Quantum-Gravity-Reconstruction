name: QGR Iter057AN complete second-background R14 map Windows

on:
  push:
    paths:
      - '.github/workflows/qgr-iter057an-second-background-full-map-windows.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  AL_AUTHORITY_ARTIFACT_ID: '10468837671'
  BASELINE_ARTIFACT_ID: '10470846229'
  VALIDATION_ARTIFACT_ID: '10470322940'

jobs:
  shard:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: 0, start: 0, stop: 139}
          - {id: 1, start: 139, stop: 278}
          - {id: 2, start: 278, stop: 417}
          - {id: 3, start: 417, stop: 556}
          - {id: 4, start: 556, stop: 695}
          - {id: 5, start: 695, stop: 834}
          - {id: 6, start: 834, stop: 973}
          - {id: 7, start: 973, stop: 1114}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check sympy
      - name: Download immutable authorities
        shell: pwsh
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          New-Item -ItemType Directory -Force authority,validation,shard-artifact | Out-Null
          $h=@{Authorization="Bearer $env:GH_TOKEN";"X-GitHub-Api-Version"="2022-11-28"}
          Invoke-WebRequest -Headers $h -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:AL_AUTHORITY_ARTIFACT_ID/zip" -OutFile authority.zip
          Expand-Archive authority.zip authority -Force
          Invoke-WebRequest -Headers $h -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:VALIDATION_ARTIFACT_ID/zip" -OutFile validation.zip
          Expand-Archive validation.zip validation -Force
      - name: Exact no-refit map shard
        shell: pwsh
        run: |
          $auth=(Get-ChildItem authority -Recurse -Filter *.json | Select-Object -First 1).FullName
          $val=(Get-ChildItem validation -Recurse -Filter *.json | Select-Object -First 1).FullName
          $env:PYTHONPATH='code'
          python code/qgr_iter057an_second_background_worker.py --authority $auth --mode shard --validation $val --start '${{ matrix.start }}' --stop '${{ matrix.stop }}' --output 'shard-artifact/shard-${{ matrix.id }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: iter057an-windows-shard-${{ matrix.id }}
          path: shard-artifact/shard-${{ matrix.id }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: shard
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check python-flint
      - uses: actions/download-artifact@v4
        with:
          pattern: iter057an-windows-shard-*
          path: raw/shards
      - name: Download immutable baseline
        shell: pwsh
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          New-Item -ItemType Directory -Force raw/baseline,aggregate-artifact | Out-Null
          $h=@{Authorization="Bearer $env:GH_TOKEN";"X-GitHub-Api-Version"="2022-11-28"}
          Invoke-WebRequest -Headers $h -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:BASELINE_ARTIFACT_ID/zip" -OutFile baseline.zip
          Expand-Archive baseline.zip raw/baseline -Force
      - name: Exact Flint aggregate
        shell: pwsh
        run: |
          $env:PYTHONPATH='code'
          python code/qgr_iter057an_second_background_aggregate.py --input-root raw --output aggregate-artifact/aggregate.json
      - uses: actions/upload-artifact@v4
        with:
          name: iter057an-windows-primary-aggregate
          path: aggregate-artifact/aggregate.json
          if-no-files-found: error
          retention-days: 30
