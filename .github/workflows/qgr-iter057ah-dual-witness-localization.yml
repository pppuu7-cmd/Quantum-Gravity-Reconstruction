name: QGR Iter057AH exact dual witness localization

on:
  push:
    paths:
      - '.github/workflows/qgr-iter057ah-dual-witness-localization.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  AF_SOURCE_RUN: '35118287075'

jobs:
  localize:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact algebra backends
        run: python -m pip install --disable-pip-version-check sympy python-flint
      - name: Download frozen exact obstruction columns
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p iter057ah-input/old iter057ah-input/af iter057ah-output
          download_extract() {
            id="$1"; dest="$2"; zip="${dest}.zip"; mkdir -p "$dest"
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" -o "$zip"
            python -m zipfile -e "$zip" "$dest"
          }
          download_extract 10444152126 iter057ah-input/old/0
          download_extract 10442437521 iter057ah-input/old/1
          download_extract 10442003071 iter057ah-input/old/2
          download_extract 10444770687 iter057ah-input/old/3
          download_extract 10443729361 iter057ah-input/old/4
          download_extract 10443653309 iter057ah-input/old/5
          download_extract 10443899697 iter057ah-input/old/6
          download_extract 10459975843 iter057ah-input/af/0
          download_extract 10462775594 iter057ah-input/af/1
          download_extract 10460706453 iter057ah-input/af/2
          download_extract 10461754625 iter057ah-input/af/3
      - name: Localize, factorize and account exact dual witness
        shell: bash
        run: |
          PYTHONPATH=code:scripts python scripts/qgr_iter057ah_dual_witness_localization.py \
            --old-root iter057ah-input/old \
            --af-root iter057ah-input/af \
            --output iter057ah-output/localization.json
      - name: Upload exact localization authority candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iter057ah-exact-dual-witness-localization
          path: iter057ah-output/
          if-no-files-found: error
          retention-days: 30
