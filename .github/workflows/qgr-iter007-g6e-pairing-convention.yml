name: qgr-iter007-g6e-pairing-convention

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/qgr_iter007_g6e_*.py'
      - '.github/workflows/qgr-iter007-g6e-pairing-convention.yml'

permissions:
  contents: read

jobs:
  lane:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        mode: [convention, repaired-g9, dewitt, screen, boundary]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Run lane
        shell: bash
        run: |
          mkdir -p build/g6e
          case '${{ matrix.mode }}' in
            convention) python code/qgr_iter007_g6e_convention_bridge.py --output build/g6e/result.json ;;
            repaired-g9) python code/qgr_iter007_g6e_repaired_g9_history.py --output build/g6e/result.json ;;
            dewitt) python code/qgr_iter007_g6e_dewitt_physical_pairing.py --output build/g6e/result.json ;;
            screen) python code/qgr_iter007_g6e_relational_screen_pairing.py --output build/g6e/result.json ;;
            boundary) python code/qgr_iter007_g6e_boundary_disintegration.py --output build/g6e/result.json ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter007-g6e-${{ matrix.mode }}
          path: build/g6e/result.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: lane
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: qgr-iter007-g6e-*
          path: iter007-g6e-results
      - run: python code/qgr_iter007_g6e_aggregate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter007-g6e-summary
          path: iter007-g6e-summary.json
          if-no-files-found: error
          retention-days: 90
