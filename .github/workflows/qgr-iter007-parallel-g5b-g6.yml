name: qgr-iter007-parallel-g5b-g6

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/qgr_iter007_parallel_*.py'
      - '.github/workflows/qgr-iter007-parallel-g5b-g6.yml'

permissions:
  contents: read

jobs:
  lane:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        mode: [bulk-rg, seed-rep, operator-census, coherent-trace, scale-audit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - run: python -m pip install --disable-pip-version-check numpy
      - name: Run lane
        shell: bash
        run: |
          mkdir -p build/iter007-parallel
          case '${{ matrix.mode }}' in
            bulk-rg) python code/qgr_iter007_parallel_bulk_rg.py --output build/iter007-parallel/result.json ;;
            seed-rep) python code/qgr_iter007_parallel_seed_rep.py --output build/iter007-parallel/result.json ;;
            operator-census) python code/qgr_iter007_parallel_operator_census.py --output build/iter007-parallel/result.json ;;
            coherent-trace) python code/qgr_iter007_parallel_coherent_trace.py --output build/iter007-parallel/result.json ;;
            scale-audit) python code/qgr_iter007_parallel_scale_audit.py --output build/iter007-parallel/result.json ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter007-${{ matrix.mode }}
          path: build/iter007-parallel/result.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: lane
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: qgr-iter007-*
          path: iter007-parallel-results
      - run: python code/qgr_iter007_parallel_aggregate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter007-parallel-summary
          path: iter007-parallel-summary.json
          if-no-files-found: error
          retention-days: 90
