name: qgr-iter007-g6d-null-bundle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/qgr_iter007_g6d_*.py'
      - '.github/workflows/qgr-iter007-g6d-null-bundle.yml'

permissions:
  contents: read

jobs:
  curved-null-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - run: python -m pip install --disable-pip-version-check numpy scipy
      - run: python code/qgr_iter007_g6d_curved_null_bundle_gram.py --output g6d-null-bundle.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter007-g6d-null-bundle
          path: g6d-null-bundle.json
          if-no-files-found: error
          retention-days: 90
