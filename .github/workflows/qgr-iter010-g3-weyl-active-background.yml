name: qgr-iter010-g3-weyl-active-background

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/qgr_iter010_g3_*.py'
      - '.github/workflows/qgr-iter010-g3-weyl-active-background.yml'

permissions:
  contents: read

jobs:
  lane:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        mode:
          - same-field-content
          - torsion-holonomy-scaling
          - ricci-weyl-limit
          - weyl-cubic-nonzero
          - cell-weyl3-h4-scaling
          - amplitude-scaling
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Install numeric dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Run lane
        shell: bash
        run: |
          mkdir -p build/g3
          case '${{ matrix.mode }}' in
            same-field-content) python code/qgr_iter010_g3_same_field_content.py > build/g3/result.json ;;
            torsion-holonomy-scaling) python code/qgr_iter010_g3_torsion_holonomy_scaling.py > build/g3/result.json ;;
            ricci-weyl-limit) python code/qgr_iter010_g3_ricci_weyl_limit.py > build/g3/result.json ;;
            weyl-cubic-nonzero) python code/qgr_iter010_g3_weyl_cubic_nonzero.py > build/g3/result.json ;;
            cell-weyl3-h4-scaling) python code/qgr_iter010_g3_cell_weyl3_h4_scaling.py > build/g3/result.json ;;
            amplitude-scaling) python code/qgr_iter010_g3_amplitude_scaling.py > build/g3/result.json ;;
          esac
          cat build/g3/result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter010-g3-${{ matrix.mode }}
          path: build/g3/result.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: lane
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: qgr-iter010-g3-*
          path: iter010-g3-results
          merge-multiple: false
      - name: Aggregate
        run: python code/qgr_iter010_g3_aggregate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter010-g3-summary
          path: iter010-g3-summary.json
          if-no-files-found: error
          retention-days: 90
