name: qgr-iter051b2-weyl3-p-connection-response

on:
  push:
    paths:
      - '.github/workflows/qgr-iter051b2-weyl3-p-connection-response.yml'
  workflow_dispatch:

# Retry after numerical-only reprojection of finite-difference P jets; frozen science unchanged.
jobs:
  lane:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        lane: [0,1,2,3]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy
      - name: Run frozen Iter051B2 lane
        shell: bash
        run: |
          set +e
          mkdir -p out
          python code/qgr_iter051b2_weyl3_p_connection_response.py --lane ${{ matrix.lane }} | tee out/lane-${{ matrix.lane }}.json
          rc=${PIPESTATUS[0]}
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qgr-iter051b2-lane-${{ matrix.lane }}
          path: out/lane-${{ matrix.lane }}.json

  aggregate:
    needs: lane
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: qgr-iter051b2-lane-*
          path: artifacts
      - name: Frozen G51B2 classification
        run: python code/qgr_iter051b2_aggregate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qgr-iter051b2-summary
          path: iter051b2-summary.json
