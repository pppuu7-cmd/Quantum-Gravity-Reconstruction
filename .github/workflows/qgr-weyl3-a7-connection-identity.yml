name: QGR Weyl3 A7 connection identity adjudication

on:
  pull_request:
    paths:
      - '.qgr-exec/weyl3-a7-connection-identity.txt'

permissions:
  contents: read

jobs:
  source_lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify frozen connection identity sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/source-lock
          PYTHONPATH=code:scripts python scripts/qgr_covariant_weyl3_a7_connection_identity_source_lock.py \
            --binding preregistrations/COVARIANT_WEYL3_A7_CONNECTION_JET_IDENTITY_EXECUTION_BINDING.json \
            --output artifacts/source-lock/source_lock.json \
            | tee artifacts/source-lock/source_lock.log
          sha256sum artifacts/source-lock/source_lock.json artifacts/source-lock/source_lock.log > artifacts/source-lock/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weyl3-a7-connection-source-lock
          path: artifacts/source-lock/
          if-no-files-found: error

  lane_a:
    needs: [source_lock]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Freeze tensor-Hessian connection identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/lane-a
          PYTHONPATH=code:scripts python scripts/qgr_covariant_weyl3_a7_connection_hessian_identity.py \
            --output artifacts/lane-a/lane_a.json \
            | tee artifacts/lane-a/lane_a.log
          sha256sum artifacts/lane-a/lane_a.json artifacts/lane-a/lane_a.log > artifacts/lane-a/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weyl3-a7-connection-lane-a
          path: artifacts/lane-a/
          if-no-files-found: error

  lane_b:
    needs: [source_lock]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Freeze direct GammaGamma connection identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/lane-b
          PYTHONPATH=code:scripts python scripts/qgr_covariant_weyl3_a7_connection_gammagamma_identity.py \
            --output artifacts/lane-b/lane_b.json \
            | tee artifacts/lane-b/lane_b.log
          sha256sum artifacts/lane-b/lane_b.json artifacts/lane-b/lane_b.log > artifacts/lane-b/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weyl3-a7-connection-lane-b
          path: artifacts/lane-b/
          if-no-files-found: error

  terminal:
    if: always()
    needs: [source_lock, lane_a, lane_b]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Prepare terminal directories
        run: mkdir -p artifacts/all/lane-a artifacts/all/lane-b artifacts/terminal
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: weyl3-a7-connection-lane-a
          path: artifacts/all/lane-a
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: weyl3-a7-connection-lane-b
          path: artifacts/all/lane-b
      - name: Frozen connection identity comparison
        shell: bash
        run: |
          set -uo pipefail
          set +e
          if test -f artifacts/all/lane-a/lane_a.json && test -f artifacts/all/lane-b/lane_b.json; then
            python scripts/qgr_covariant_weyl3_a7_connection_identity_terminal.py \
              --lane-a artifacts/all/lane-a/lane_a.json \
              --lane-b artifacts/all/lane-b/lane_b.json \
              --output artifacts/terminal/terminal.json \
              | tee artifacts/terminal/terminal.log
            rc=${PIPESTATUS[0]}
          else
            python -c 'import hashlib,json,pathlib; p={"gate":"COVARIANT_WEYL3_A7_CONNECTION_JET_IDENTITY_ADJUDICATION","classification":"BLOCKED_EXECUTION_OR_PROVENANCE","reason":"required identity lane artifact missing","c6":"SYMBOLIC_UNFIXED","corrected_q10_locked":True,"theory_established_pct":0}; p["terminal_payload_sha256"]=hashlib.sha256(json.dumps(p,sort_keys=True,separators=(",",":"),ensure_ascii=True).encode()).hexdigest(); pathlib.Path("artifacts/terminal/terminal.json").write_text(json.dumps(p,sort_keys=True,indent=2)+"\\n"); print(json.dumps(p,sort_keys=True,indent=2))'
            cp artifacts/terminal/terminal.json artifacts/terminal/terminal.log
            rc=2
          fi
          set -e
          echo "${rc}" > artifacts/terminal/EXIT_CODE.txt
          sha256sum artifacts/terminal/terminal.json artifacts/terminal/terminal.log artifacts/terminal/EXIT_CODE.txt > artifacts/terminal/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weyl3-a7-connection-terminal
          path: artifacts/terminal/
          if-no-files-found: error
      - name: Block only execution or provenance failure
        shell: bash
        run: test "$(cat artifacts/terminal/EXIT_CODE.txt)" -eq 0
