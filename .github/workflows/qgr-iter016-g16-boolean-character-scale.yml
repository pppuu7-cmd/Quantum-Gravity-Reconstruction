name: qgr-iter016-g16-boolean-character-scale

on:
  push:
    paths:
      - 'code/qgr_iter016_g16_boolean_character_scale.py'
      - 'code/qgr_iter016_g16_aggregate.py'
      - '.github/workflows/qgr-iter016-g16-boolean-character-scale.yml'
  workflow_dispatch:

jobs:
  lane:
    strategy:
      fail-fast: false
      max-parallel: 24
      matrix:
        audit: [character-composition, history-order, scale-nonuniqueness, amplitude-sensitivity]
        lane: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: G16 exact Boolean/refinement character audit
        run: |
          mkdir -p out
          python code/qgr_iter016_g16_boolean_character_scale.py \
            --audit '${{ matrix.audit }}' \
            --lane '${{ matrix.lane }}' \
            --out out/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: qgr-g16-${{ matrix.audit }}-${{ matrix.lane }}
          path: out/result.json

  aggregate:
    needs: lane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: qgr-g16-*
          path: iter016-g16-results
      - name: Aggregate 24 G16 lanes
        run: python code/qgr_iter016_g16_aggregate.py
      - uses: actions/upload-artifact@v4
        with:
          name: qgr-g16-summary
          path: iter016-g16-summary/summary.json
