name: qgr-iter007-g6h-broadband

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/qgr_iter007_g6h_*.py'
      - '.github/workflows/qgr-iter007-g6h-broadband.yml'

permissions:
  contents: read

jobs:
  lane:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        mode: [validation, broadband-m0, broadband-m1, polarization]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Run lane
        shell: bash
        run: |
          mkdir -p build/g6h
          case '${{ matrix.mode }}' in
            validation) python code/qgr_iter007_g6h_envelope_validation.py --output build/g6h/result.json ;;
            broadband-m0) python code/qgr_iter007_g6h_broadband_profile.py --profile m0 --output build/g6h/result.json ;;
            broadband-m1) python code/qgr_iter007_g6h_broadband_profile.py --profile m1 --output build/g6h/result.json ;;
            polarization) python code/qgr_iter007_g6h_polarization_dependence.py --output build/g6h/result.json ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter007-g6h-${{ matrix.mode }}
          path: build/g6h/result.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: lane
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: qgr-iter007-g6h-*
          path: iter007-g6h-results
      - run: python code/qgr_iter007_g6h_aggregate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter007-g6h-summary
          path: iter007-g6h-summary.json
          if-no-files-found: error
          retention-days: 90
