name: qgr-iter035-g35-distant-branch-verification

on:
  push:
    paths:
      - 'code/qgr_iter035_g35_distant_branch_verification.py'
      - 'code/qgr_iter035_g35_aggregate.py'
      - '.github/workflows/qgr-iter035-g35-distant-branch-verification.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        lane: [0,1,2,3,4,5]
        scale_index: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: G35 independent branch verification
        run: |
          mkdir -p out
          python code/qgr_iter035_g35_distant_branch_verification.py \
            --lane '${{ matrix.lane }}' \
            --scale-index '${{ matrix.scale_index }}' \
            --out out/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: qgr-g35-${{ matrix.lane }}-${{ matrix.scale_index }}
          path: out/result.json

  aggregate:
    if: always()
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: qgr-g35-*
          path: iter035-g35-results
          merge-multiple: false
      - name: Aggregate frozen G35 gate
        run: python code/qgr_iter035_g35_aggregate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qgr-g35-summary
          path: iter035-g35-summary/summary.json

# Production trigger after prospective gate freeze.
