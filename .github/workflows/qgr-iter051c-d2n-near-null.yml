name: qgr-iter051c-d2n-near-null

on:
  push:
    paths:
      - 'status/ITERATION_051C_D2N_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scientific:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {stream: A, index: 0}
          - {stream: A, index: 1}
          - {stream: A, index: 2}
          - {stream: A, index: 3}
          - {stream: A, index: 4}
          - {stream: A, index: 5}
          - {stream: B, index: 0}
          - {stream: B, index: 1}
    name: ${{ matrix.stream }}-${{ matrix.index }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy sympy
      - name: Frozen D2N conditioning lane
        run: python code/qgr_iter051c_d2n_near_null.py --stream '${{ matrix.stream }}' --index '${{ matrix.index }}' --out 'iter051c-d2n-output/lane-${{ matrix.stream }}-${{ matrix.index }}.json'
      - name: Upload lane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qgr-iter051c-d2n-${{ matrix.stream }}-${{ matrix.index }}
          path: iter051c-d2n-output/lane-${{ matrix.stream }}-${{ matrix.index }}.json
          if-no-files-found: warn

  aggregate:
    runs-on: ubuntu-24.04
    if: always()
    needs: scientific
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: qgr-iter051c-d2n-*
          path: artifacts
          merge-multiple: false
      - name: Frozen D2N aggregate classifier
        run: python code/qgr_iter051c_d2n_aggregate.py
      - name: Upload authoritative summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qgr-iter051c-d2n-summary
          path: iter051c-d2n-summary/summary.json
          if-no-files-found: warn
