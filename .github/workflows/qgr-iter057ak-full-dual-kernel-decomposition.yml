name: QGR Iter057AK full dual-kernel decomposition

on:
  push:
    paths:
      - '.github/workflows/qgr-iter057ak-full-dual-kernel-decomposition.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  decompose:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact algebra backends
        run: python -m pip install --disable-pip-version-check sympy python-flint
      - name: Download immutable Iter057AD/AF column authorities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p iter057ak-input/old iter057ak-input/af iter057ak-output
          get_art() { id="$1"; dest="$2"; mkdir -p "$dest"; curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" -o "${dest}.zip"; python -m zipfile -e "${dest}.zip" "$dest"; }
          get_art 10444152126 iter057ak-input/old/0
          get_art 10442437521 iter057ak-input/old/1
          get_art 10442003071 iter057ak-input/old/2
          get_art 10444770687 iter057ak-input/old/3
          get_art 10443729361 iter057ak-input/old/4
          get_art 10443653309 iter057ak-input/old/5
          get_art 10443899697 iter057ak-input/old/6
          get_art 10459975843 iter057ak-input/af/0
          get_art 10462775594 iter057ak-input/af/1
          get_art 10460706453 iter057ak-input/af/2
          get_art 10461754625 iter057ak-input/af/3
      - name: Compute complete exact dual-kernel decomposition
        shell: bash
        run: |
          set +e
          PYTHONPATH=code:scripts python scripts/qgr_iter057ak_full_dual_kernel_decomposition.py --old-root iter057ak-input/old --af-root iter057ak-input/af --output iter057ak-output/iter057ak.json
          code=$?
          echo "$code" > iter057ak-output/evaluator_exit_code.txt
          cat iter057ak-output/iter057ak.json
          exit "$code"
      - name: Upload exact primary authority candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iter057ak-full-dual-kernel-decomposition
          path: iter057ak-output/
          if-no-files-found: error
          retention-days: 30
