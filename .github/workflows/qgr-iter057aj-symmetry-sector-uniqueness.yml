name: QGR Iter057AJ exact symmetry-sector uniqueness

on:
  push:
    paths:
      - '.github/workflows/qgr-iter057aj-symmetry-sector-uniqueness.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  uniqueness:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact algebra backends
        run: python -m pip install --disable-pip-version-check sympy python-flint
      - name: Download immutable Iter057AD/AF column authorities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p iter057aj-input/old iter057aj-input/af iter057aj-output
          download_extract() {
            id="$1"; dest="$2"; zip="${dest}.zip"; mkdir -p "$dest"
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" -o "$zip"
            python -m zipfile -e "$zip" "$dest"
          }
          download_extract 10444152126 iter057aj-input/old/0
          download_extract 10442437521 iter057aj-input/old/1
          download_extract 10442003071 iter057aj-input/old/2
          download_extract 10444770687 iter057aj-input/old/3
          download_extract 10443729361 iter057aj-input/old/4
          download_extract 10443653309 iter057aj-input/old/5
          download_extract 10443899697 iter057aj-input/old/6
          download_extract 10459975843 iter057aj-input/af/0
          download_extract 10462775594 iter057aj-input/af/1
          download_extract 10460706453 iter057aj-input/af/2
          download_extract 10461754625 iter057aj-input/af/3
      - name: Compute exact parity and S3 sector uniqueness
        shell: bash
        run: |
          set +e
          PYTHONPATH=code:scripts python scripts/qgr_iter057aj_symmetry_sector_uniqueness.py \
            --old-root iter057aj-input/old \
            --af-root iter057aj-input/af \
            --output iter057aj-output/iter057aj.json
          code=$?
          echo "$code" > iter057aj-output/evaluator_exit_code.txt
          cat iter057aj-output/iter057aj.json
          exit "$code"
      - name: Upload exact symmetry-sector authority candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iter057aj-symmetry-sector-uniqueness
          path: iter057aj-output/
          if-no-files-found: error
          retention-days: 30
