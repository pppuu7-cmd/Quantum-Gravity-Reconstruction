name: qgr-iter007-g6g-polarization

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/qgr_iter007_g6g_*.py'
      - '.github/workflows/qgr-iter007-g6g-polarization.yml'

permissions:
  contents: read

jobs:
  lane:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        mode: [casimirs, wigner, comparator]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Run lane
        shell: bash
        run: |
          mkdir -p build/g6g
          case '${{ matrix.mode }}' in
            casimirs) python code/qgr_iter007_g6g_lorentz_holonomy_invariants.py --output build/g6g/result.json ;;
            wigner) python code/qgr_iter007_g6g_wigner_spin2_benchmark.py --output build/g6g/result.json ;;
            comparator) python code/qgr_iter007_g6g_narrow_packet_comparator.py --output build/g6g/result.json ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter007-g6g-${{ matrix.mode }}
          path: build/g6g/result.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: lane
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: qgr-iter007-g6g-*
          path: iter007-g6g-results
      - run: python code/qgr_iter007_g6g_aggregate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter007-g6g-summary
          path: iter007-g6g-summary.json
          if-no-files-found: error
          retention-days: 90
