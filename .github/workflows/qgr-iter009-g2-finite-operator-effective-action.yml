name: qgr-iter009-g2-finite-operator-effective-action

on:
  push:
    paths:
      - 'code/qgr_iter009_g2_*.py'
      - '.github/workflows/qgr-iter009-g2-finite-operator-effective-action.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lane:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: l2-states
            script: code/qgr_iter009_g2_l2_states.py
            output: iter009-g2-l2-states.json
          - name: finite-depth-channel
            script: code/qgr_iter009_g2_finite_depth_channel.py
            output: iter009-g2-finite-depth-channel.json
          - name: finite-cell-action-authority
            script: code/qgr_iter009_g2_finite_cell_action_authority.py
            output: iter009-g2-finite-cell-action-authority.json
          - name: curvature-sq-redefinition
            script: code/qgr_iter009_g2_curvature_sq_redefinition.py
            output: iter009-g2-curvature-sq-redefinition.json
          - name: first-nonredundant-order
            script: code/qgr_iter009_g2_first_nonredundant_order.py
            output: iter009-g2-first-nonredundant-order.json
          - name: infinite-refinement-criterion
            script: code/qgr_iter009_g2_infinite_refinement_criterion.py
            output: iter009-g2-infinite-refinement-criterion.json
    runs-on: ubuntu-24.04
    name: lane (${{ matrix.name }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Run lane
        run: python "${{ matrix.script }}" > "${{ matrix.output }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter009-g2-${{ matrix.name }}
          path: ${{ matrix.output }}
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: lane
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: qgr-iter009-g2-*
          path: iter009-g2-results
          merge-multiple: false
      - name: Aggregate
        run: python code/qgr_iter009_g2_aggregate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter009-g2-summary
          path: iter009-g2-summary.json
          if-no-files-found: error
          retention-days: 90
