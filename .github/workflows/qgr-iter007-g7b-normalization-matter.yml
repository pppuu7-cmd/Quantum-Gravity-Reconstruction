name: qgr-iter007-g7b-normalization-matter

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/qgr_iter007_g7b_*.py'
      - '.github/workflows/qgr-iter007-g7b-normalization-matter.yml'

permissions:
  contents: read

jobs:
  lane:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        mode: [history-phase, measure-scale, scalar-matter, species-universality]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Run lane
        shell: bash
        run: |
          mkdir -p build/g7b
          case '${{ matrix.mode }}' in
            history-phase) python code/qgr_iter007_g7b_history_phase_normalization.py --output build/g7b/result.json ;;
            measure-scale) python code/qgr_iter007_g7b_measure_scale_audit.py --output build/g7b/result.json ;;
            scalar-matter) python code/qgr_iter007_g7b_scalar_matter_census.py --output build/g7b/result.json ;;
            species-universality) python code/qgr_iter007_g7b_species_universality_countertest.py --output build/g7b/result.json ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter007-g7b-${{ matrix.mode }}
          path: build/g7b/result.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: lane
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: qgr-iter007-g7b-*
          path: iter007-g7b-results
      - run: python code/qgr_iter007_g7b_aggregate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter007-g7b-summary
          path: iter007-g7b-summary.json
          if-no-files-found: error
          retention-days: 90
