name: qgr-iter053-qd2-support-direct-convergence

on:
  push:
    paths:
      - 'status/ITER053_QD2_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {stream: A, index: 0}
          - {stream: A, index: 1}
          - {stream: A, index: 2}
          - {stream: A, index: 3}
          - {stream: B, index: 0}
          - {stream: B, index: 1}
          - {stream: C, index: 0}
          - {stream: C, index: 1}
    name: ${{ matrix.stream }}-${{ matrix.index }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy sympy
      - name: Frozen Iter053-QD2 support convergence lane
        run: python code/qgr_iter053_qd2_support_convergence.py --stream '${{ matrix.stream }}' --index '${{ matrix.index }}' --out 'iter053-qd2-output/${{ matrix.stream }}-${{ matrix.index }}.json'
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qgr-iter053-qd2-${{ matrix.stream }}-${{ matrix.index }}
          path: iter053-qd2-output/${{ matrix.stream }}-${{ matrix.index }}.json
          if-no-files-found: warn

  aggregate:
    runs-on: ubuntu-24.04
    if: always()
    needs: diagnostic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: qgr-iter053-qd2-*
          path: artifacts
          merge-multiple: false
      - name: Frozen Iter053-QD2 aggregate classifier
        run: python code/qgr_iter053_qd2_aggregate.py
      - name: Upload diagnostic summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qgr-iter053-qd2-summary
          path: iter053-qd2-summary/summary.json
          if-no-files-found: warn
