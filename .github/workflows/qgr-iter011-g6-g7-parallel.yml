name: qgr-iter011-g6-g7-parallel
on:
  push:
    branches: [main]
    paths:
      - 'code/qgr_iter011_g6_component_decomposition.py'
      - 'code/qgr_iter011_g7_kappa_scaling.py'
      - '.github/workflows/qgr-iter011-g6-g7-parallel.yml'
  workflow_dispatch:
jobs:
  g6:
    strategy:
      fail-fast: false
      matrix:
        point: [0,1,2,3]
        kappa: [0.01,0.02,0.04]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Install numeric dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Run component lane
        env:
          PYTHONPATH: code
        run: |
          mkdir -p build/g6
          python code/qgr_iter011_g6_component_decomposition.py --point ${{ matrix.point }} --kappa ${{ matrix.kappa }} | tee build/g6/result.json
          python -m json.tool build/g6/result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter011-g6-p${{ matrix.point }}-k${{ matrix.kappa }}
          path: build/g6/result.json
  g7:
    strategy:
      fail-fast: false
      matrix:
        point: [0,1,2,3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Install numeric dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Run kappa-scaling lane
        env:
          PYTHONPATH: code
        run: |
          mkdir -p build/g7
          python code/qgr_iter011_g7_kappa_scaling.py --point ${{ matrix.point }} | tee build/g7/result.json
          python -m json.tool build/g7/result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter011-g7-p${{ matrix.point }}
          path: build/g7/result.json
  aggregate:
    needs: [g6,g7]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate matrix completion
        run: |
          test '${{ needs.g6.result }}' = 'success'
          test '${{ needs.g7.result }}' = 'success'
