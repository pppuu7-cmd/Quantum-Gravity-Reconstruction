name: QGR Iter054G dynamical-treatment selection authority

on:
  push:
    paths:
      - 'code/qgr_iter054g_dynamical_treatment_selection.py'
      - 'prereg/ITER054G-WEYL3-DYNAMICAL-TREATMENT-SELECTION-AUTHORITY.md'
      - '.github/workflows/qgr-iter054g-dynamical-treatment-selection.yml'
  workflow_dispatch:

jobs:
  stream:
    strategy:
      fail-fast: false
      matrix:
        stream: [S0, A0, A1, B0, B1]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check sympy
      - name: Frozen Iter054G stream
        run: python code/qgr_iter054g_dynamical_treatment_selection.py --stream '${{ matrix.stream }}' --out 'iter054g/${{ matrix.stream }}/result.json'
      - uses: actions/upload-artifact@v4
        with:
          name: iter054g-${{ matrix.stream }}
          path: iter054g/${{ matrix.stream }}/result.json
          if-no-files-found: error

  aggregate:
    needs: stream
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check sympy
      - uses: actions/download-artifact@v4
        with:
          pattern: iter054g-*
          path: iter054g-input
          merge-multiple: false
      - name: Frozen Iter054G aggregate
        run: python code/qgr_iter054g_dynamical_treatment_selection.py --aggregate iter054g-input --out iter054g-summary/summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: iter054g-summary
          path: iter054g-summary/summary.json
          if-no-files-found: error
