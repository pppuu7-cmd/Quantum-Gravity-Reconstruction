name: qgr-iter037-g37c-g10b-admissibility

on:
  push:
    paths:
      - 'status/ITERATION_037_G37C_TRIGGER.txt'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        seed_slot: [0,1,2,3,4,5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: G37C frozen G10B same-realization audit
        run: |
          mkdir -p out
          python code/qgr_iter037_g37c_g10b_admissibility.py \
            --seed-slot '${{ matrix.seed_slot }}' \
            --out out/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: qgr-g37c-${{ matrix.seed_slot }}
          path: out/result.json

  aggregate:
    if: always()
    needs: audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: qgr-g37c-*
          path: iter037-g37c-results
          merge-multiple: false
      - name: Aggregate frozen G37C gate
        run: python code/qgr_iter037_g37c_aggregate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qgr-g37c-summary
          path: iter037-g37c-summary/summary.json
