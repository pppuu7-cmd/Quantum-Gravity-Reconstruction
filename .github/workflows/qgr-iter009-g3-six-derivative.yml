name: qgr-iter009-g3-six-derivative

on:
  push:
    paths:
      - 'code/qgr_iter009_g3_*.py'
      - '.github/workflows/qgr-iter009-g3-six-derivative.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lane:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: weyl-cubic-basis
            script: code/qgr_iter009_g3_weyl_cubic_basis.py
            output: iter009-g3-weyl-cubic-basis.json
          - name: derivative-curvature-reduction
            script: code/qgr_iter009_g3_derivative_curvature_reduction.py
            output: iter009-g3-derivative-curvature-reduction.json
          - name: nonzero-witness
            script: code/qgr_iter009_g3_nonzero_weyl_cubic_witness.py
            output: iter009-g3-nonzero-witness.json
          - name: six-derivative-scaling
            script: code/qgr_iter009_g3_six_derivative_scaling.py
            output: iter009-g3-six-derivative-scaling.json
          - name: c6-authority
            script: code/qgr_iter009_g3_c6_authority_audit.py
            output: iter009-g3-c6-authority.json
          - name: order-competition
            script: code/qgr_iter009_g3_order_competition.py
            output: iter009-g3-order-competition.json
    runs-on: ubuntu-24.04
    name: lane (${{ matrix.name }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Run lane
        run: python "${{ matrix.script }}" > "${{ matrix.output }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter009-g3-${{ matrix.name }}
          path: ${{ matrix.output }}
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: lane
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: qgr-iter009-g3-*
          path: iter009-g3-results
          merge-multiple: false
      - name: Aggregate
        run: python code/qgr_iter009_g3_aggregate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter009-g3-summary
          path: iter009-g3-summary.json
          if-no-files-found: error
          retention-days: 90
