name: QGR Iter057AM validated direct held-out map Windows

on:
  push:
    paths:
      - '.github/workflows/qgr-iter057am-validated-direct-map-windows.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  HELDOUT_ARTIFACT_ID: '10468978252'
  BASELINE_ARTIFACT_ID: '10468429521'
  VALIDATION_ARTIFACT_ID: '10468799851'

jobs:
  shard:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: 0, start: 0, stop: 139}
          - {id: 1, start: 139, stop: 278}
          - {id: 2, start: 278, stop: 417}
          - {id: 3, start: 417, stop: 556}
          - {id: 4, start: 556, stop: 695}
          - {id: 5, start: 695, stop: 834}
          - {id: 6, start: 834, stop: 973}
          - {id: 7, start: 973, stop: 1114}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check sympy
      - name: Download immutable held-out and validation authorities
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force heldout,validation,shard-artifact | Out-Null
          $h=@{Authorization="Bearer $env:GH_TOKEN";"X-GitHub-Api-Version"="2022-11-28"}
          Invoke-WebRequest -Headers $h -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:HELDOUT_ARTIFACT_ID/zip" -OutFile heldout.zip
          Expand-Archive -Path heldout.zip -DestinationPath heldout -Force
          Invoke-WebRequest -Headers $h -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:VALIDATION_ARTIFACT_ID/zip" -OutFile validation.zip
          Expand-Archive -Path validation.zip -DestinationPath validation -Force
      - name: Exact validated direct-map shard
        shell: pwsh
        run: |
          $auth=(Get-ChildItem -Path heldout -Recurse -Filter *.json | Select-Object -First 1).FullName
          $val=(Get-ChildItem -Path validation -Recurse -Filter *.json | Select-Object -First 1).FullName
          $env:PYTHONPATH='code'
          python code/qgr_iter057am_direct_map_shard.py --authority $auth --validation $val --start '${{ matrix.start }}' --stop '${{ matrix.stop }}' --output 'shard-artifact/shard-${{ matrix.id }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: iter057am-windows-direct-shard-${{ matrix.id }}
          path: shard-artifact/shard-${{ matrix.id }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: shard
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check python-flint
      - uses: actions/download-artifact@v4
        with:
          pattern: iter057am-windows-direct-shard-*
          path: raw-authorities/shards
      - name: Download immutable repaired baseline authority
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force raw-authorities/baseline,aggregate-artifact | Out-Null
          $h=@{Authorization="Bearer $env:GH_TOKEN";"X-GitHub-Api-Version"="2022-11-28"}
          Invoke-WebRequest -Headers $h -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:BASELINE_ARTIFACT_ID/zip" -OutFile baseline.zip
          Expand-Archive -Path baseline.zip -DestinationPath raw-authorities/baseline -Force
      - name: Exact Flint aggregate ranks and witness
        shell: pwsh
        run: |
          $env:PYTHONPATH='code'
          python code/qgr_iter057am_heldout_obstruction_aggregate.py --input-root raw-authorities --output aggregate-artifact/aggregate.json
      - uses: actions/upload-artifact@v4
        with:
          name: iter057am-windows-direct-primary-aggregate
          path: aggregate-artifact/aggregate.json
          if-no-files-found: error
          retention-days: 30

  critic:
    needs: shard
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check sympy
      - uses: actions/download-artifact@v4
        with:
          pattern: iter057am-windows-direct-shard-*
          path: raw-authorities/shards
      - name: Download immutable repaired baseline authority
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force raw-authorities/baseline,critic-artifact | Out-Null
          $h=@{Authorization="Bearer $env:GH_TOKEN";"X-GitHub-Api-Version"="2022-11-28"}
          Invoke-WebRequest -Headers $h -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:BASELINE_ARTIFACT_ID/zip" -OutFile baseline.zip
          Expand-Archive -Path baseline.zip -DestinationPath raw-authorities/baseline -Force
      - name: Independent integer-cleared exact Critic
        shell: pwsh
        run: |
          $env:PYTHONPATH='scripts'
          python scripts/qgr_iter057am_integer_cleared_critic.py --input-root raw-authorities --output critic-artifact/critic.json
      - uses: actions/upload-artifact@v4
        with:
          name: iter057am-windows-direct-independent-critic
          path: critic-artifact/critic.json
          if-no-files-found: error
          retention-days: 30
