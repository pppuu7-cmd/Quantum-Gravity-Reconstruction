name: QGR Iter057AP target-blind trace Ward repair

on:
  push:
    paths:
      - '.github/workflows/qgr-iter057ap-traceward-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construct:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact algebra dependency
        run: python -m pip install --disable-pip-version-check sympy
      - name: Run target-blind repaired constructor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/iter057ap-traceward-repair
          PYTHONPATH=code python code/qgr_iter057ap_traceward_repair.py --output artifacts/iter057ap-traceward-repair/result.json
      - name: Upload repaired constructor authority candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iter057ap-traceward-repaired-constructor
          path: artifacts/iter057ap-traceward-repair/result.json
          if-no-files-found: error
          retention-days: 30
