name: QGR Iter057AM held-out no-refit R14 obstruction transport

on:
  push:
    paths:
      - '.github/workflows/qgr-iter057am-heldout-obstruction-transport.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  HELDOUT_ARTIFACT_ID: '10468978252'

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check sympy
      - name: Download immutable Iter057AL held-out authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p heldout baseline-artifact
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${HELDOUT_ARTIFACT_ID}/zip" -o heldout.zip
          python -m zipfile -e heldout.zip heldout
      - name: Fresh held-out R14 baseline and O0
        shell: bash
        run: |
          AUTH="$(find heldout -name '*.json' -type f | head -n1)"
          test -n "$AUTH"
          PYTHONPATH=code python code/qgr_iter057am_heldout_obstruction_worker.py --authority "$AUTH" --mode baseline --output baseline-artifact/baseline.json
      - name: Upload immutable baseline
        uses: actions/upload-artifact@v4
        with:
          name: iter057am-baseline
          path: baseline-artifact/baseline.json
          if-no-files-found: error
          retention-days: 30

  shard:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: 0, start: 0, stop: 139}
          - {id: 1, start: 139, stop: 278}
          - {id: 2, start: 278, stop: 417}
          - {id: 3, start: 417, stop: 556}
          - {id: 4, start: 556, stop: 695}
          - {id: 5, start: 695, stop: 834}
          - {id: 6, start: 834, stop: 973}
          - {id: 7, start: 973, stop: 1114}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check sympy
      - name: Download immutable Iter057AL held-out authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p heldout shard-artifact
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${HELDOUT_ARTIFACT_ID}/zip" -o heldout.zip
          python -m zipfile -e heldout.zip heldout
      - name: Exact frozen obstruction-map shard
        shell: bash
        run: |
          AUTH="$(find heldout -name '*.json' -type f | head -n1)"
          test -n "$AUTH"
          PYTHONPATH=code python code/qgr_iter057am_heldout_obstruction_worker.py --authority "$AUTH" --mode shard --start '${{ matrix.start }}' --stop '${{ matrix.stop }}' --output 'shard-artifact/shard-${{ matrix.id }}.json'
      - name: Upload immutable shard
        uses: actions/upload-artifact@v4
        with:
          name: iter057am-shard-${{ matrix.id }}
          path: shard-artifact/shard-${{ matrix.id }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: [baseline, shard]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check python-flint
      - uses: actions/download-artifact@v4
        with:
          pattern: iter057am-*
          path: raw-authorities
      - name: Exact Flint aggregate, ranks and dual witness
        shell: bash
        run: |
          mkdir -p aggregate-artifact
          PYTHONPATH=code python code/qgr_iter057am_heldout_obstruction_aggregate.py --input-root raw-authorities --output aggregate-artifact/aggregate.json
      - name: Upload primary aggregate
        uses: actions/upload-artifact@v4
        with:
          name: iter057am-primary-aggregate
          path: aggregate-artifact/aggregate.json
          if-no-files-found: error
          retention-days: 30

  critic:
    needs: [baseline, shard]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check sympy
      - uses: actions/download-artifact@v4
        with:
          pattern: iter057am-*
          path: raw-authorities
      - name: Independent integer-cleared exact Critic
        shell: bash
        run: |
          mkdir -p critic-artifact
          PYTHONPATH=scripts python scripts/qgr_iter057am_integer_cleared_critic.py --input-root raw-authorities --output critic-artifact/critic.json
      - name: Upload independent Critic
        uses: actions/upload-artifact@v4
        with:
          name: iter057am-independent-critic
          path: critic-artifact/critic.json
          if-no-files-found: error
          retention-days: 30
