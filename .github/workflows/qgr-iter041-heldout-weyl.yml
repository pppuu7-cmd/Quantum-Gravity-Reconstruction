name: qgr-iter041-heldout-weyl

on:
  push:
    paths:
      - 'status/ITERATION_041_TRIGGER.txt'
  workflow_dispatch:

jobs:
  stream-a:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        index: [0,1,2,3,4,5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: A held-out shape transfer
        run: |
          mkdir -p out
          python code/qgr_iter041_heldout_weyl.py --stream A --index '${{ matrix.index }}' --out out/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qgr-iter041-A-${{ matrix.index }}
          path: out/result.json

  stream-b:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        index: [0,1,2,3,4,5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: B held-out refinement transfer
        run: |
          mkdir -p out
          python code/qgr_iter041_heldout_weyl.py --stream B --index '${{ matrix.index }}' --out out/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qgr-iter041-B-${{ matrix.index }}
          path: out/result.json

  stream-c:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        index: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: C held-out amplitude law
        run: |
          mkdir -p out
          python code/qgr_iter041_heldout_weyl.py --stream C --index '${{ matrix.index }}' --out out/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qgr-iter041-C-${{ matrix.index }}
          path: out/result.json

  stream-d:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        index: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: D held-out rotated cubic-null falsifiers
        run: |
          mkdir -p out
          python code/qgr_iter041_heldout_weyl.py --stream D --index '${{ matrix.index }}' --out out/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qgr-iter041-D-${{ matrix.index }}
          path: out/result.json

  stream-e:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        index: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: E held-out rotation covariance
        run: |
          mkdir -p out
          python code/qgr_iter041_heldout_weyl.py --stream E --index '${{ matrix.index }}' --out out/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qgr-iter041-E-${{ matrix.index }}
          path: out/result.json

  aggregate:
    if: always()
    needs: [stream-a,stream-b,stream-c,stream-d,stream-e]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with:
          pattern: qgr-iter041-*
          path: iter041-results
          merge-multiple: false
      - name: Aggregate frozen Iter041 gate
        run: python code/qgr_iter041_aggregate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qgr-iter041-summary
          path: iter041-summary/summary.json
