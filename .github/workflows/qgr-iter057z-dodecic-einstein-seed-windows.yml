# retrigger after artifact-directory I/O fix; frozen scientific solve unchanged
name: qgr-iter057z-dodecic-einstein-seed-windows
on:
  push:
    paths:
      - '.github/workflows/qgr-iter057z-dodecic-einstein-seed-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-dodecic-seed-windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check sympy
      - name: Reproduce Iter057Z exact dodecic Einstein seed
        run: python code/qgr_iter057z_dodecic_einstein_seed_completion.py --out artifacts/iter057z.json
      - name: Show classification
        if: always()
        shell: pwsh
        run: python -c "import json; o=json.load(open('artifacts/iter057z.json')); print(o['classification']); print(o['matrix_shape'],o['rank_M'],o['rank_augmented'],o['compatibility_nonzero_count'],o['particular_nonzero_count'])"
      - name: Upload raw exact result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iter057z-dodecic-einstein-seed-windows
          path: artifacts/iter057z.json
          if-no-files-found: error
