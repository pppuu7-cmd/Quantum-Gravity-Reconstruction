name: qgr-iter008-g2-clock-dynamics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/qgr_iter008_g2_*.py'
      - '.github/workflows/qgr-iter008-g2-clock-dynamics.yml'

permissions:
  contents: read

jobs:
  lane:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        mode: [prefix-law, sequential-isometry, transport, phase-freedom]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Run lane
        shell: bash
        run: |
          mkdir -p build/g2
          case '${{ matrix.mode }}' in
            prefix-law) python code/qgr_iter008_g2_prefix_transition_law.py --output build/g2/result.json ;;
            sequential-isometry) python code/qgr_iter008_g2_sequential_isometry_factorization.py --output build/g2/result.json ;;
            transport) python code/qgr_iter008_g2_edge_transport_clock_composition.py --output build/g2/result.json ;;
            phase-freedom) python code/qgr_iter008_g2_clock_phase_freedom.py --output build/g2/result.json ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter008-g2-${{ matrix.mode }}
          path: build/g2/result.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: lane
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: qgr-iter008-g2-*
          path: iter008-g2-results
      - run: python code/qgr_iter008_g2_aggregate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter008-g2-summary
          path: iter008-g2-summary.json
          if-no-files-found: error
          retention-days: 90
