name: QGR Iter057AM fmpz exact rank Critic

on:
  push:
    paths:
      - '.github/workflows/qgr-iter057am-fmpz-rank-critic.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  BASELINE_ARTIFACT_ID: '10468429521'

jobs:
  rank:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check python-flint
      - name: Download immutable complete map and baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force raw/baseline,raw/shards,out | Out-Null
          $h=@{Authorization="Bearer $env:GH_TOKEN";"X-GitHub-Api-Version"="2022-11-28"}
          function F([string]$id,[string]$dest) {
            New-Item -ItemType Directory -Force $dest | Out-Null
            Invoke-WebRequest -Headers $h -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$id/zip" -OutFile "$dest.zip"
            Expand-Archive -Path "$dest.zip" -DestinationPath $dest -Force
          }
          F $env:BASELINE_ARTIFACT_ID raw/baseline/base
          F 10469353962 raw/shards/0
          F 10469034827 raw/shards/1
          F 10469468423 raw/shards/2
          F 10469596885 raw/shards/3
          F 10469328100 raw/shards/4
          F 10470120501 raw/shards/5
          F 10469785715 raw/shards/6
          F 10469218826 raw/shards/7
      - name: Exact integer-cleared Flint ranks
        shell: pwsh
        run: python scripts/qgr_iter057am_fmpz_rank_critic.py --input-root raw --output out/rank.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter057am-fmpz-exact-rank-critic
          path: out/
          if-no-files-found: error
          retention-days: 30
