name: qgr-iter052-4d-directional-variation

on:
  push:
    paths:
      - 'status/ITERATION_052_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scientific:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {stream: A, index: 0}
          - {stream: A, index: 1}
          - {stream: A, index: 2}
          - {stream: A, index: 3}
          - {stream: A, index: 4}
          - {stream: A, index: 5}
          - {stream: B, index: 0}
          - {stream: B, index: 1}
          - {stream: B, index: 2}
          - {stream: C, index: 0}
          - {stream: C, index: 1}
          - {stream: C, index: 2}
    name: ${{ matrix.stream }}-${{ matrix.index }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy sympy
      - name: Frozen Iter052 four-dimensional directional-variation lane
        run: python code/qgr_iter052_4d_directional_variation.py --stream '${{ matrix.stream }}' --index '${{ matrix.index }}' --out 'iter052-output/${{ matrix.stream }}-${{ matrix.index }}.json'
      - name: Upload lane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qgr-iter052-${{ matrix.stream }}-${{ matrix.index }}
          path: iter052-output/${{ matrix.stream }}-${{ matrix.index }}.json
          if-no-files-found: warn

  aggregate:
    runs-on: ubuntu-24.04
    if: always()
    needs: scientific
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: qgr-iter052-*
          path: artifacts
          merge-multiple: false
      - name: Frozen Iter052 aggregate classifier
        run: python code/qgr_iter052_aggregate.py
      - name: Upload authoritative summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qgr-iter052-summary
          path: iter052-summary/summary.json
          if-no-files-found: warn
