name: QGR Iter057AQ degree-six causal adjudication

on:
  push:
    paths:
      - '.github/workflows/qgr-iter057aq-degree6-causal-adjudication.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adjudicate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact dependency
        run: python -m pip install --disable-pip-version-check sympy
      - name: Run exact target-blind 2x2 intervention
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/iter057aq
          PYTHONPATH=code python code/qgr_iter057aq_degree6_causal_adjudication.py --output artifacts/iter057aq/result.json
      - name: Upload exact adjudication artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iter057aq-degree6-causal-adjudication
          path: artifacts/iter057aq/result.json
          if-no-files-found: error
          retention-days: 30
