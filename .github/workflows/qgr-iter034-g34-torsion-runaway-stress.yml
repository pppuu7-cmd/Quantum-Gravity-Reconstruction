name: qgr-iter034-g34-torsion-runaway-stress

on:
  push:
    paths:
      - 'code/qgr_iter034_g34_torsion_runaway_stress.py'
      - 'code/qgr_iter034_g34_aggregate.py'
      - '.github/workflows/qgr-iter034-g34-torsion-runaway-stress.yml'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mode: [large-start, background-continuation]
        lane: [0,1,2,3,4,5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: G34 nonlinear torsion stress scan
        run: |
          mkdir -p out
          python code/qgr_iter034_g34_torsion_runaway_stress.py \
            --mode '${{ matrix.mode }}' \
            --lane '${{ matrix.lane }}' \
            --out out/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: qgr-g34-${{ matrix.mode }}-${{ matrix.lane }}
          path: out/result.json

  aggregate:
    if: always()
    needs: scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: qgr-g34-*
          path: iter034-g34-results
          merge-multiple: false
      - name: Aggregate G34 nonlinear scans
        run: python code/qgr_iter034_g34_aggregate.py
      - uses: actions/upload-artifact@v4
        with:
          name: qgr-g34-summary
          path: iter034-g34-summary/summary.json
