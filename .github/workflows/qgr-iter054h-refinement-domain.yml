name: QGR Iter054H refinement-domain conditional order-reduction

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/qgr-iter054h-refinement-domain.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  A0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exact symbolic scale separation
        run: python code/qgr_iter054h_refinement_domain.py --lane A0 --out A0.json
      - uses: actions/upload-artifact@v4
        with: {name: iter054h-A0, path: A0.json}
  A1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Frozen rational panel
        run: python code/qgr_iter054h_refinement_domain.py --lane A1 --out A1.json
      - uses: actions/upload-artifact@v4
        with: {name: iter054h-A1, path: A1.json}
  B0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Frozen source authority audit
        run: python code/qgr_iter054h_refinement_domain.py --lane B0 --out B0.json
      - uses: actions/upload-artifact@v4
        with: {name: iter054h-B0, path: B0.json}
  B1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Anti-overclaim controls
        run: python code/qgr_iter054h_refinement_domain.py --lane B1 --out B1.json
      - uses: actions/upload-artifact@v4
        with: {name: iter054h-B1, path: B1.json}
  aggregate:
    needs: [A0,A1,B0,B1]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: iter054h-A0, path: artifacts/A0}
      - uses: actions/download-artifact@v4
        with: {name: iter054h-A1, path: artifacts/A1}
      - uses: actions/download-artifact@v4
        with: {name: iter054h-B0, path: artifacts/B0}
      - uses: actions/download-artifact@v4
        with: {name: iter054h-B1, path: artifacts/B1}
      - name: Frozen aggregate classifier
        run: |
          python code/qgr_iter054h_refinement_domain.py --lane aggregate --out ITER054H_SUMMARY.json artifacts/A0/A0.json artifacts/A1/A1.json artifacts/B0/B0.json artifacts/B1/B1.json
      - uses: actions/upload-artifact@v4
        with: {name: iter054h-summary, path: ITER054H_SUMMARY.json}
