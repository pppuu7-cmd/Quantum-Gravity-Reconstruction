name: qgr-iter007-g6a-history-composition

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/qgr_iter007_g6a_*.py'
      - '.github/workflows/qgr-iter007-g6a-history-composition.yml'

permissions:
  contents: read

jobs:
  lane:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        mode: [joint-law, poset, spatial-factor]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - run: python -m pip install --disable-pip-version-check numpy
      - name: Run lane
        shell: bash
        run: |
          mkdir -p build/g6a
          case '${{ matrix.mode }}' in
            joint-law) python code/qgr_iter007_g6a_joint_history_law.py --output build/g6a/result.json ;;
            poset) python code/qgr_iter007_g6a_poset_composition.py --output build/g6a/result.json ;;
            spatial-factor) python code/qgr_iter007_g6a_spatial_factorization.py --output build/g6a/result.json ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter007-g6a-${{ matrix.mode }}
          path: build/g6a/result.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: lane
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: qgr-iter007-g6a-*
          path: iter007-g6a-results
      - run: python code/qgr_iter007_g6a_aggregate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter007-g6a-summary
          path: iter007-g6a-summary.json
          if-no-files-found: error
          retention-days: 90
