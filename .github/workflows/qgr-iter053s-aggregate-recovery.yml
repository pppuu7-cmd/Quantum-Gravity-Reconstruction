name: qgr-iter053s-aggregate-recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qgr-iter053s-aggregate-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  aggregate-frozen-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen classifier dependencies
        run: python -m pip install --disable-pip-version-check numpy sympy scipy
      - name: Download original Iter053S substantive artifacts only
        uses: actions/download-artifact@v4
        with:
          pattern: qgr-iter053s-*
          path: artifacts
          repository: pppuu7-cmd/Quantum-Gravity-Reconstruction
          run-id: '34787788933'
          github-token: ${{ github.token }}
      - name: Frozen Iter053S aggregate classification
        run: |
          mkdir -p summary
          PYTHONPATH=code python code/qgr_iter053s_h5_tensor_density_covariance.py \
            --mode aggregate --input-dir artifacts --out summary/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qgr-iter053s-recovered-summary
          path: summary/summary.json
          if-no-files-found: error
