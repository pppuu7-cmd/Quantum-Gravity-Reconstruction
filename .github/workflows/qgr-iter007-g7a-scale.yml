name: qgr-iter007-g7a-scale

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/qgr_iter007_g7a_*.py'
      - '.github/workflows/qgr-iter007-g7a-scale.yml'

permissions:
  contents: read

jobs:
  lane:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        mode: [power-count, identifiability, history-reparam, authority]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Run lane
        shell: bash
        run: |
          mkdir -p build/g7a
          case '${{ matrix.mode }}' in
            power-count) python code/qgr_iter007_g7a_scale_power_count.py --output build/g7a/result.json ;;
            identifiability) python code/qgr_iter007_g7a_scale_identifiability.py --output build/g7a/result.json ;;
            history-reparam) python code/qgr_iter007_g7a_history_scale_reparam.py --output build/g7a/result.json ;;
            authority) python code/qgr_iter007_g7a_normalization_authority_guard.py --output build/g7a/result.json ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter007-g7a-${{ matrix.mode }}
          path: build/g7a/result.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: lane
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: qgr-iter007-g7a-*
          path: iter007-g7a-results
      - run: python code/qgr_iter007_g7a_aggregate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter007-g7a-summary
          path: iter007-g7a-summary.json
          if-no-files-found: error
          retention-days: 90
