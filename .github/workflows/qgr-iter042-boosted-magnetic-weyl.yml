name: qgr-iter042-boosted-magnetic-weyl

on:
  push:
    paths:
      - 'status/ITERATION_042_TRIGGER.txt'
  workflow_dispatch:

jobs:
  stream-a:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: {index: [0,1,2,3,4,5]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check numpy scipy
      - name: A magnetic-Weyl emergence
        run: |
          mkdir -p out
          python code/qgr_iter042_boosted_weyl.py --stream A --index '${{ matrix.index }}' --out out/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'qgr-iter042-A-${{ matrix.index }}', path: out/result.json}

  stream-b:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: {index: [0,1,2,3,4,5]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check numpy scipy
      - name: B scalar Lorentz invariance under refinement
        run: |
          mkdir -p out
          python code/qgr_iter042_boosted_weyl.py --stream B --index '${{ matrix.index }}' --out out/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'qgr-iter042-B-${{ matrix.index }}', path: out/result.json}

  stream-c:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: {index: [0,1,2,3]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check numpy scipy
      - name: C boost reversal magnetic parity
        run: |
          mkdir -p out
          python code/qgr_iter042_boosted_weyl.py --stream C --index '${{ matrix.index }}' --out out/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'qgr-iter042-C-${{ matrix.index }}', path: out/result.json}

  stream-d:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: {index: [0,1,2,3]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check numpy scipy
      - name: D boosted amplitude law
        run: |
          mkdir -p out
          python code/qgr_iter042_boosted_weyl.py --stream D --index '${{ matrix.index }}' --out out/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'qgr-iter042-D-${{ matrix.index }}', path: out/result.json}

  stream-e:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: {index: [0,1,2,3]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check numpy scipy
      - name: E small-velocity magnetic response
        run: |
          mkdir -p out
          python code/qgr_iter042_boosted_weyl.py --stream E --index '${{ matrix.index }}' --out out/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'qgr-iter042-E-${{ matrix.index }}', path: out/result.json}

  aggregate:
    if: always()
    needs: [stream-a,stream-b,stream-c,stream-d,stream-e]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with:
          pattern: qgr-iter042-*
          path: iter042-results
          merge-multiple: false
      - name: Aggregate frozen Iter042 gate
        run: python code/qgr_iter042_aggregate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qgr-iter042-summary
          path: iter042-summary/summary.json
