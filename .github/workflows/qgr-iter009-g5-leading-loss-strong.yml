name: qgr-iter009-g5-leading-loss-strong

on:
  push:
    paths:
      - 'code/qgr_iter009_g5_*.py'
      - '.github/workflows/qgr-iter009-g5-leading-loss-strong.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lane:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - name: history-loss-c6-order
            script: code/qgr_iter009_g5_history_loss_c6_order.py
            output: iter009-g5-history-loss-c6-order.json
            heavy: 'false'
          - name: common-unitary-purity
            script: code/qgr_iter009_g5_common_unitary_purity.py
            output: iter009-g5-common-unitary-purity.json
            heavy: 'false'
          - name: absolute-observable-c6
            script: code/qgr_iter009_g5_absolute_observable_c6.py
            output: iter009-g5-absolute-observable-c6.json
            heavy: 'false'
          - name: relative-holonomy-extended
            script: code/qgr_iter009_g5_relative_holonomy_extended.py
            output: iter009-g5-relative-holonomy-extended.json
            heavy: 'true'
          - name: packet-strong-convergence
            script: code/qgr_iter009_g5_packet_strong_convergence.py
            output: iter009-g5-packet-strong-convergence.json
            heavy: 'false'
          - name: strong-vs-norm
            script: code/qgr_iter009_g5_strong_vs_norm.py
            output: iter009-g5-strong-vs-norm.json
            heavy: 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    name: lane (${{ matrix.name }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Install numeric dependencies for heavy lane
        if: matrix.heavy == 'true'
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Run lane
        run: python "${{ matrix.script }}" > "${{ matrix.output }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter009-g5-${{ matrix.name }}
          path: ${{ matrix.output }}
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: lane
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: qgr-iter009-g5-*
          path: iter009-g5-results
          merge-multiple: false
      - name: Aggregate
        run: python code/qgr_iter009_g5_aggregate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter009-g5-summary
          path: iter009-g5-summary.json
          if-no-files-found: error
          retention-days: 90
