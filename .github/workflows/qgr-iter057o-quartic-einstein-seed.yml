name: qgr-iter057o-quartic-einstein-seed

on:
  push:
    paths:
      - '.github/workflows/qgr-iter057o-quartic-einstein-seed.yml'
  workflow_dispatch:

jobs:
  exact-seed-completion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check sympy
      - name: Solve and independently verify quartic seed completion
        run: |
          mkdir -p out
          PYTHONPATH=code python code/qgr_iter057o_quartic_einstein_seed_completion.py --out out/iter057o.json
      - name: Show classification
        if: always()
        run: cat out/iter057o.json || true
      - name: Upload exact seed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iter057o-quartic-einstein-seed
          path: out/iter057o.json
          if-no-files-found: warn
