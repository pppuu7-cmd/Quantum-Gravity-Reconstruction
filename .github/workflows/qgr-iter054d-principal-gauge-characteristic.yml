name: QGR Iter054D principal-order gauge completion audit

on:
  push:
    paths:
      - 'code/qgr_iter054d_principal_gauge_characteristic.py'
      - 'prereg/ITER054D-WEYL3-PRINCIPAL-ORDER-GAUGE-FIXING-CHARACTERISTIC-AUDIT.md'
      - '.github/workflows/qgr-iter054d-principal-gauge-characteristic.yml'
  workflow_dispatch:

jobs:
  stream:
    strategy:
      fail-fast: false
      matrix:
        stream: [A0, A1, B0, B1]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check sympy
      - name: Frozen Iter054D stream
        run: python code/qgr_iter054d_principal_gauge_characteristic.py --stream '${{ matrix.stream }}' --out 'iter054d/${{ matrix.stream }}/result.json'
      - uses: actions/upload-artifact@v4
        with:
          name: iter054d-${{ matrix.stream }}
          path: iter054d/${{ matrix.stream }}/result.json
          if-no-files-found: error

  aggregate:
    needs: stream
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check sympy
      - uses: actions/download-artifact@v4
        with:
          pattern: iter054d-*
          path: iter054d-input
          merge-multiple: false
      - name: Frozen Iter054D aggregate
        run: python code/qgr_iter054d_principal_gauge_characteristic.py --aggregate iter054d-input --out iter054d-summary/summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: iter054d-summary
          path: iter054d-summary/summary.json
          if-no-files-found: error
