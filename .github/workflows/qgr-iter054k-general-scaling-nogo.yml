name: QGR Iter054K general-scaling fixed-band no-go

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qgr-iter054k-general-scaling-nogo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  A0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exact identity and malformed control
        run: python code/qgr_iter054k_general_scaling_nogo.py --lane A0 --out A0.json
      - uses: actions/upload-artifact@v4
        with: {name: iter054k-A0, path: A0.json}
  A1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arbitrary non-power diagnostic sequences
        run: python code/qgr_iter054k_general_scaling_nogo.py --lane A1 --out A1.json
      - uses: actions/upload-artifact@v4
        with: {name: iter054k-A1, path: A1.json}
  B0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: General compatibility implication controls
        run: python code/qgr_iter054k_general_scaling_nogo.py --lane B0 --out B0.json
      - uses: actions/upload-artifact@v4
        with: {name: iter054k-B0, path: B0.json}
  B1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authority and anti-overclaim controls
        run: python code/qgr_iter054k_general_scaling_nogo.py --lane B1 --out B1.json
      - uses: actions/upload-artifact@v4
        with: {name: iter054k-B1, path: B1.json}
  aggregate:
    needs: [A0,A1,B0,B1]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: iter054k-A0, path: artifacts/A0}
      - uses: actions/download-artifact@v4
        with: {name: iter054k-A1, path: artifacts/A1}
      - uses: actions/download-artifact@v4
        with: {name: iter054k-B0, path: artifacts/B0}
      - uses: actions/download-artifact@v4
        with: {name: iter054k-B1, path: artifacts/B1}
      - name: Frozen aggregate classifier
        run: python code/qgr_iter054k_general_scaling_nogo.py --lane aggregate --out ITER054K_SUMMARY.json artifacts/A0/A0.json artifacts/A1/A1.json artifacts/B0/B0.json artifacts/B1/B1.json
      - uses: actions/upload-artifact@v4
        with: {name: iter054k-summary, path: ITER054K_SUMMARY.json}
