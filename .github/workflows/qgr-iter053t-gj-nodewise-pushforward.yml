name: qgr-iter053t-gj-nodewise-pushforward

on:
  push:
    paths:
      - 'status/ITERATION_053T_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lane:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {index: 0, hstep: '0.001'}
          - {index: 0, hstep: '0.0005'}
          - {index: 0, hstep: '0.00025'}
          - {index: 1, hstep: '0.001'}
          - {index: 1, hstep: '0.0005'}
          - {index: 1, hstep: '0.00025'}
    name: C${{ matrix.index }}-h${{ matrix.hstep }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy sympy scipy
      - name: Frozen Iter053T nodewise pushforward lane
        run: python code/qgr_iter053t_gj_nodewise_pushforward.py --index '${{ matrix.index }}' --hstep '${{ matrix.hstep }}' --out lane.json
      - name: Upload lane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qgr-iter053t-C${{ matrix.index }}-h${{ matrix.hstep }}
          path: lane.json
          if-no-files-found: warn

  aggregate:
    runs-on: ubuntu-24.04
    if: always()
    needs: lane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: qgr-iter053t-*
          path: artifacts
          merge-multiple: false
      - name: Frozen Iter053T aggregate classifier
        run: python code/qgr_iter053t_aggregate.py
      - name: Upload authoritative summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qgr-iter053t-summary
          path: iter053t-summary/summary.json
          if-no-files-found: warn
