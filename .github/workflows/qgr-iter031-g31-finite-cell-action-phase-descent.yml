name: qgr-iter031-g31-finite-cell-action-phase-descent

on:
  push:
    paths:
      - 'code/qgr_iter031_g31_finite_cell_action_phase_descent.py'
      - 'code/qgr_iter031_g31_aggregate.py'
      - '.github/workflows/qgr-iter031-g31-finite-cell-action-phase-descent.yml'
  workflow_dispatch:

jobs:
  lane:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        audit:
          - global-log-branch-nonuniqueness
          - weak-cell-principal-branch
          - finite-sample-integral-nullspace
          - overall-action-phase-scale
          - finite-refinement-integral-nullspace
        lane: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: G31 finite-cell action phase descent audit
        run: |
          mkdir -p out
          python code/qgr_iter031_g31_finite_cell_action_phase_descent.py \
            --audit '${{ matrix.audit }}' \
            --lane '${{ matrix.lane }}' \
            --out out/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: qgr-g31-${{ matrix.audit }}-${{ matrix.lane }}
          path: out/result.json

  aggregate:
    if: always()
    needs: lane
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: qgr-g31-*
          path: iter031-g31-results
          merge-multiple: false
      - name: Aggregate 30 G31 lanes
        run: python code/qgr_iter031_g31_aggregate.py
      - uses: actions/upload-artifact@v4
        with:
          name: qgr-g31-summary
          path: iter031-g31-summary/summary.json
