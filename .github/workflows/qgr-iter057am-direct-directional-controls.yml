name: QGR Iter057AM direct directional frozen controls

on:
  push:
    paths:
      - '.github/workflows/qgr-iter057am-direct-directional-controls.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  HELDOUT_ARTIFACT_ID: '10468978252'

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check sympy
      - name: Download immutable held-out Iter057AL authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p heldout out
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${HELDOUT_ARTIFACT_ID}/zip" -o heldout.zip
          python -m zipfile -e heldout.zip heldout
      - name: Exact direct-vs-full controls 0 557 1113
        shell: bash
        run: |
          AUTH="$(find heldout -name '*.json' -type f | head -n1)"
          PYTHONPATH=code python code/qgr_iter057am_direct_directional.py --authority "$AUTH" --indices 0,557,1113 --output out/control.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter057am-direct-directional-controls
          path: out/
          if-no-files-found: error
          retention-days: 30
