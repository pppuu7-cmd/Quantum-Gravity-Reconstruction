name: qgr-iter007-g6c-local-net-readout

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/qgr_iter007_g6c_*.py'
      - '.github/workflows/qgr-iter007-g6c-local-net-readout.yml'

permissions:
  contents: read

jobs:
  lane:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        mode: [fiber-product, relative-tensor, quotient-descent, algebra-intersection]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Run lane
        shell: bash
        run: |
          mkdir -p build/g6c
          case '${{ matrix.mode }}' in
            fiber-product) python code/qgr_iter007_g6c_local_net_fiber_product.py --output build/g6c/result.json ;;
            relative-tensor) python code/qgr_iter007_g6c_boundary_relative_tensor.py --output build/g6c/result.json ;;
            quotient-descent) python code/qgr_iter007_g6c_physical_quotient_descent.py --output build/g6c/result.json ;;
            algebra-intersection) python code/qgr_iter007_g6c_cylindrical_algebra_intersection.py --output build/g6c/result.json ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter007-g6c-${{ matrix.mode }}
          path: build/g6c/result.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: lane
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: qgr-iter007-g6c-*
          path: iter007-g6c-results
      - run: python code/qgr_iter007_g6c_aggregate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter007-g6c-summary
          path: iter007-g6c-summary.json
          if-no-files-found: error
          retention-days: 90
