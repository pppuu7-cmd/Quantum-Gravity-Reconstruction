name: qgr-iter057b-two-block-pencil

on:
  push:
    paths:
      - '.github/workflows/qgr-iter057b-two-block-pencil.yml'
  workflow_dispatch:

jobs:
  symbolic-pencil-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact symbolic dependency
        run: python -m pip install --disable-pip-version-check sympy
      - name: Run frozen Iter057B audit
        run: |
          mkdir -p out
          python code/qgr_iter057b_null_cone_two_block_pencil.py --out out/iter057b_summary.json
      - name: Show classification
        run: cat out/iter057b_summary.json
      - name: Upload symbolic audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: iter057b-two-block-pencil-summary
          path: out/iter057b_summary.json
          if-no-files-found: error
