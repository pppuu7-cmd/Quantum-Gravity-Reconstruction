name: qgr-iter053-qd3m-moment-audit

on:
  push:
    paths:
      - 'status/ITER053_QD3M_TRIGGER.txt'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy scipy sympy
      - name: Frozen QD3 Gauss-Jacobi moment audit
        run: python code/qgr_iter053_qd3m_moment_audit.py
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qgr-iter053-qd3m-result
          path: iter053-qd3m-output/result.json
          if-no-files-found: warn
