name: qgr-iter042r-frame-completion

on:
  push:
    paths:
      - 'status/ITERATION_042R_TRIGGER.txt'
  workflow_dispatch:

jobs:
  stream-a:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: {index: [0,1,2,3,4,5,6,7]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check numpy scipy
      - name: A exact scalar contraction audit
        run: |
          mkdir -p out
          python code/qgr_iter042r_frame_completion.py --stream A --index '${{ matrix.index }}' --out out/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'qgr-iter042r-A-${{ matrix.index }}', path: out/result.json}

  stream-b:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: {index: [0,1,2,3,4,5]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check numpy scipy
      - name: B frame-completed scalar refinement
        run: |
          mkdir -p out
          python code/qgr_iter042r_frame_completion.py --stream B --index '${{ matrix.index }}' --out out/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'qgr-iter042r-B-${{ matrix.index }}', path: out/result.json}

  stream-c:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: {index: [0,1,2,3]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check numpy scipy
      - name: C mixed-frame attribution
        run: |
          mkdir -p out
          python code/qgr_iter042r_frame_completion.py --stream C --index '${{ matrix.index }}' --out out/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'qgr-iter042r-C-${{ matrix.index }}', path: out/result.json}

  stream-d:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: {index: [0,1,2,3,4,5]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check numpy scipy
      - name: D corrected magnetic diagnostics
        run: |
          mkdir -p out
          python code/qgr_iter042r_frame_completion.py --stream D --index '${{ matrix.index }}' --out out/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'qgr-iter042r-D-${{ matrix.index }}', path: out/result.json}

  aggregate:
    if: always()
    needs: [stream-a,stream-b,stream-c,stream-d]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with:
          pattern: qgr-iter042r-*
          path: iter042r-results
          merge-multiple: false
      - name: Aggregate frozen Iter042R diagnostic
        run: python code/qgr_iter042r_aggregate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qgr-iter042r-summary
          path: iter042r-summary/summary.json
