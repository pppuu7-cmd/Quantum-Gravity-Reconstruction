name: qgr-iter010-g1-c6-identifiability

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/qgr_iter010_g1_*.py'
      - '.github/workflows/qgr-iter010-g1-c6-identifiability.yml'

permissions:
  contents: read

jobs:
  lane:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        mode:
          - connection-density-derivative-order
          - c6-sensitivity-rank
          - history-c6-sensitivity-order
          - higher-derivative-authority-scan
          - weyl3-family-witness
          - minimal-matching-datum
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Run lane
        shell: bash
        run: |
          mkdir -p build/g1
          case '${{ matrix.mode }}' in
            connection-density-derivative-order) python code/qgr_iter010_g1_connection_density_derivative_order.py > build/g1/result.json ;;
            c6-sensitivity-rank) python code/qgr_iter010_g1_c6_sensitivity_rank.py > build/g1/result.json ;;
            history-c6-sensitivity-order) python code/qgr_iter010_g1_history_c6_sensitivity_order.py > build/g1/result.json ;;
            higher-derivative-authority-scan) python code/qgr_iter010_g1_higher_derivative_authority_scan.py > build/g1/result.json ;;
            weyl3-family-witness) python code/qgr_iter010_g1_weyl3_family_witness.py > build/g1/result.json ;;
            minimal-matching-datum) python code/qgr_iter010_g1_minimal_matching_datum.py > build/g1/result.json ;;
          esac
          cat build/g1/result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter010-g1-${{ matrix.mode }}
          path: build/g1/result.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: lane
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: qgr-iter010-g1-*
          path: iter010-g1-results
          merge-multiple: false
      - name: Aggregate
        run: python code/qgr_iter010_g1_aggregate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qgr-iter010-g1-summary
          path: iter010-g1-summary.json
          if-no-files-found: error
          retention-days: 90
