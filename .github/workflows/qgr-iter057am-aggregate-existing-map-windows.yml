name: QGR Iter057AM aggregate completed direct map Windows

on:
  push:
    paths:
      - '.github/workflows/qgr-iter057am-aggregate-existing-map-windows.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  BASELINE_ARTIFACT_ID: '10468429521'

jobs:
  aggregate:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check python-flint
      - name: Download frozen complete Ubuntu map and baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force raw-authorities/baseline,raw-authorities/shards,aggregate-artifact | Out-Null
          $h=@{Authorization="Bearer $env:GH_TOKEN";"X-GitHub-Api-Version"="2022-11-28"}
          function Fetch-Art([string]$id,[string]$dest) {
            New-Item -ItemType Directory -Force $dest | Out-Null
            Invoke-WebRequest -Headers $h -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$id/zip" -OutFile "$dest.zip"
            Expand-Archive -Path "$dest.zip" -DestinationPath $dest -Force
          }
          Fetch-Art $env:BASELINE_ARTIFACT_ID 'raw-authorities/baseline/base'
          Fetch-Art '10469353962' 'raw-authorities/shards/0'
          Fetch-Art '10469034827' 'raw-authorities/shards/1'
          Fetch-Art '10469468423' 'raw-authorities/shards/2'
          Fetch-Art '10469596885' 'raw-authorities/shards/3'
          Fetch-Art '10469328100' 'raw-authorities/shards/4'
          Fetch-Art '10470120501' 'raw-authorities/shards/5'
          Fetch-Art '10469785715' 'raw-authorities/shards/6'
          Fetch-Art '10469218826' 'raw-authorities/shards/7'
      - name: Exact Flint aggregate ranks and normalized witness
        shell: pwsh
        run: |
          $env:PYTHONPATH='code'
          python code/qgr_iter057am_heldout_obstruction_aggregate.py --input-root raw-authorities --output aggregate-artifact/aggregate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter057am-existing-map-windows-aggregate
          path: aggregate-artifact/
          if-no-files-found: error
          retention-days: 30

  critic:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check sympy
      - name: Download frozen complete Ubuntu map and baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force raw-authorities/baseline,raw-authorities/shards,critic-artifact | Out-Null
          $h=@{Authorization="Bearer $env:GH_TOKEN";"X-GitHub-Api-Version"="2022-11-28"}
          function Fetch-Art([string]$id,[string]$dest) {
            New-Item -ItemType Directory -Force $dest | Out-Null
            Invoke-WebRequest -Headers $h -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$id/zip" -OutFile "$dest.zip"
            Expand-Archive -Path "$dest.zip" -DestinationPath $dest -Force
          }
          Fetch-Art $env:BASELINE_ARTIFACT_ID 'raw-authorities/baseline/base'
          Fetch-Art '10469353962' 'raw-authorities/shards/0'
          Fetch-Art '10469034827' 'raw-authorities/shards/1'
          Fetch-Art '10469468423' 'raw-authorities/shards/2'
          Fetch-Art '10469596885' 'raw-authorities/shards/3'
          Fetch-Art '10469328100' 'raw-authorities/shards/4'
          Fetch-Art '10470120501' 'raw-authorities/shards/5'
          Fetch-Art '10469785715' 'raw-authorities/shards/6'
          Fetch-Art '10469218826' 'raw-authorities/shards/7'
      - name: Independent integer-cleared exact Critic
        shell: pwsh
        run: |
          $env:PYTHONPATH='scripts'
          python scripts/qgr_iter057am_integer_cleared_critic.py --input-root raw-authorities --output critic-artifact/critic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter057am-existing-map-windows-critic
          path: critic-artifact/
          if-no-files-found: error
          retention-days: 30
